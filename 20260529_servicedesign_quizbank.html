          B: "為讓管理階層買單，可善用視覺化的「人物誌」或「顧客旅程圖」促進他們對顧客痛點的理解。",
          C: "推動變革時，若能順應並融入公司既有文化，過程會比強硬植入新思維更順利（絲滑）。",
          D: "服務設計只能由上而下 (Top-down) 推動才有效，基層員工自發的下而上 (Bottom-up) 創新通常會失敗。",
          E: "選擇範圍明確的「小專案」作為起點，有助團隊快速累積成功經驗與自信。"
        },
        correct: ["B", "C", "E"],
        mine: ["B", "C", "E"],
        wrong: false,
        explain: "視覺化說服高層 (B)、融入文化絲滑 (C)、小專案起點 (E)。A 閉門造車錯（應公開透明）、D「只能上而下」錯（上下手法都有好處）。"
      },
      {
        id: "12-2",
        section: "擴張影響力",
        stem: "進入「擴張」階段，哪些擴張策略正確？",
        options: {
          A: "專案命名應符合組織內部文化與溝通習慣，最好能讓人從名稱就看懂主題。",
          B: "為保持商業機密，擴張期間應嚴格禁止團隊與外部服務設計社群進行任何交流或知識分享。",
          C: "團隊編制可分為「核心服務設計團隊」與支援的「延伸專案團隊」，以維持任務調度彈性。",
          D: "擴張意味必須立刻把所有部門主管都換成有設計背景的人，否則無法真正轉型。",
          E: "培養員工的主持能力與熟悉協作平台，是擴張期非常重要的相關專業能力建設。"
        },
        correct: ["A", "C", "E"],
        mine: ["A", "C", "E"],
        wrong: false,
        explain: "命名見主題 (A)、核心＋延伸團隊 (C)、培養專業能力 (E)。B 禁止外部交流（應與社群連結）、D 全換設計背景主管皆錯。"
      },
      {
        id: "12-3",
        section: "全球跨界案例",
        stem: "觀察書中全球大型組織案例，哪些敘述正確展現服務設計的影響力？",
        options: {
          A: "德國電信在公營轉民營的巨大轉型中，透過導入顧客研究室的新作法，成功將服務設計納入員工教育訓練框架。",
          B: "泰國案例證明服務設計只能應用在純粹數位軟體開發，無法用於高鐵或中央火車站這類實體公共建設。",
          C: "奧地利將「商業與服務管理」納入中學課綱，顯示服務設計教育已可向下扎根到基礎教育體系。",
          D: "服務設計的視野也能引導企業走向永續發展，幫助組織與客戶共同落實 ESG 的環保與社會目標。",
          E: "STBY 與 Google 的合作案例說明，大型跨國企業不需外部單位協助，靠內部工程師就能獨立完成所有跨專案知識整合。"
        },
        correct: ["A", "C", "D"],
        mine: ["A", "C", "D"],
        wrong: false,
        explain: "德國電信教育訓練 (A)、奧地利中學課綱 (C)、引導 ESG (D)。B 限縮泰國於數位（實際含高鐵、火車站）、E 否定外部 STBY 合作皆錯。"
      },
      {
        id: "12-4",
        section: "理論與實務融合（TAM × SDT）",
        stem: "將「科技接受模式 (TAM)」與「自我決定論 (SDT)」融入組織推動服務設計變革，哪些論述合理有效？",
        options: {
          A: "讓員工清楚看見專案具體成效（前線客訴量減少），能直接提升他們對新流程的「認知有用性」。",
          B: "透過公開透明的專案資訊與邀請跨部門參與共創，能滿足員工的「自主性 (Autonomy)」，進而激發投入變革的內在動機。",
          C: "只要高層下達強硬 KPI 考核，就算員工覺得新共創流程很繁瑣（低認知易用性），他們也會長久且開心地落實。",
          D: "若管理階層能透過影音和旅程圖，讓員工理解變革背後的「為何而戰」，有助將外部要求內化為員工自身的價值認同。",
          E: "學術理論與實務變革完全脫鉤，SDT 與 TAM 只能用在寫論文，無法解釋或預測員工對服務設計的接受度。"
        },
        correct: ["A", "B", "D"],
        mine: ["A", "D"],
        wrong: true,
        note: "易漏 B：跨部門共創能滿足 SDT 的「自主性」；更深一層，它最強烈觸發的其實是「關聯性 Relatedness」——大家為共同目標建立歸屬感。",
        explain: "認知有用性 (A)、共創滿足自主性 (B)、為何而戰內化 (D)。C 強硬 KPI 無法讓人「開心落實」、E 理論與實務脫鉤皆錯。\n\n【進階洞察】進階洞察：跨部門共創其實最深刻觸發的是 SDT 的「關聯性 (Relatedness)」——大家為共同目標坐在一起、建立歸屬感；同時也兼滿足「自主性 (Autonomy)」（被賦權塑造自己要用的系統，而非被強迫接受）。這個「構面解構」是更精準的學術論證角度。（常見漏選 B）"
      },
      {
        id: "12-5",
        section: "深根組織的最終樣貌",
        stem: "當一個組織真正讓「服務設計深根」時，會出現哪些現象？",
        options: {
          A: "服務設計不再是少數設計師的專利，而是各部門（行銷、技術、第一線）解決日常問題的共同語言與思維模式。",
          B: "組織會完全放棄傳統商業邏輯與預算考量，一切只以顧客開不開心為唯一標準。",
          C: "面對新挑戰時，團隊習慣先進行初步研究與釐清利害關係人，而非急著在會議室憑空想像解決方案。",
          D: "組織內部會建立持續培養相關專業能力（組合研究方法、舉辦同理心工作坊）的常態化機制。",
          E: "原本僵化的穀倉效應會被打破，部門之間能透過共創平台進行更透明、流暢的協作。"
        },
        correct: ["A", "C", "D", "E"],
        mine: ["A", "C", "D", "E"],
        wrong: false,
        explain: "成為共同語言 (A)、先研究再發想 (C)、常態化培訓 (D)、打破穀倉 (E)。B「完全放棄商業邏輯與預算」過度——服務設計不否定商業現實。"
      }
    ]
  }
];

</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:ital,opsz,wght@1,9..144,600;0,9..144,900&display=swap');

  :root{
    --ink:#1a1714;
    --paper:#f4efe6;
    --paper2:#ece4d6;
    --line:#d6cbb6;
    --accent:#b5402a;       /* 朱紅 */
    --accent-deep:#7e2417;
    --gold:#c08a2d;
    --green:#3d6b4a;
    --wrong:#b5402a;
    --right:#3d6b4a;
    --muted:#8a7f6c;
    --card:#fbf8f1;
    --shadow:0 1px 0 rgba(0,0,0,.04), 0 14px 30px -18px rgba(40,30,15,.5);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.7;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(192,138,45,.06), transparent 30%),
      radial-gradient(circle at 88% 22%, rgba(181,64,42,.05), transparent 28%);
  }

  /* ---- header ---- */
  header.masthead{
    border-bottom:3px double var(--ink);
    padding:38px 22px 22px;
    max-width:1040px; margin:0 auto;
    position:relative;
  }
  .kicker{
    font-family:"Noto Sans TC";
    letter-spacing:.42em; font-size:11px; font-weight:700;
    text-transform:uppercase; color:var(--accent-deep);
    margin-bottom:14px;
  }
  h1.title{
    font-family:"Noto Serif TC",serif; font-weight:900;
    font-size:clamp(34px,6vw,60px); line-height:1.04;
    margin:0 0 6px; letter-spacing:-.5px;
  }
  h1.title .em{ font-family:"Fraunces",serif; font-style:italic; font-weight:600; color:var(--accent); }
  .subtitle{
    font-family:"Noto Serif TC",serif; font-size:16px; color:var(--muted);
    border-top:1px solid var(--line); padding-top:12px; margin-top:14px;
    display:flex; flex-wrap:wrap; gap:6px 22px; align-items:baseline;
  }
  .subtitle b{color:var(--ink); font-weight:700;}

  /* ---- stats strip ---- */
  .stats{
    max-width:1040px; margin:18px auto 0; padding:0 22px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
  }
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:3px;
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .stat .n{font-family:"Fraunces",serif; font-style:italic; font-weight:900; font-size:30px; line-height:1; color:var(--ink);}
  .stat.warn .n{color:var(--accent);}
  .stat .l{font-size:11.5px; color:var(--muted); letter-spacing:.08em; margin-top:6px;}

  /* ---- controls ---- */
  .controls{
    max-width:1040px; margin:24px auto 0; padding:0 22px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  .seg{display:flex; border:1.5px solid var(--ink); border-radius:3px; overflow:hidden;}
  .seg button{
    font-family:"Noto Sans TC"; font-size:13px; font-weight:700;
    background:transparent; border:none; padding:9px 15px; cursor:pointer;
    color:var(--ink); border-right:1px solid var(--ink); transition:.15s;
  }
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--ink); color:var(--paper);}
  .seg button.warn.on{background:var(--accent); border-color:var(--accent);}
  .toggle{
    margin-left:auto; display:flex; gap:8px; align-items:center;
    font-size:12.5px; color:var(--muted);
  }
  .chip{
    font-family:"Noto Sans TC"; font-size:12.5px; font-weight:700; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:30px;
    padding:7px 14px; color:var(--ink); transition:.15s; white-space:nowrap;
  }
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}

  .chapter-nav{
    max-width:1040px; margin:14px auto 0; padding:0 22px;
    display:flex; flex-wrap:wrap; gap:8px;
  }

  /* ---- main ---- */
  main{max-width:1040px; margin:0 auto; padding:10px 22px 90px;}
  .chap-head{
    margin:40px 0 4px; padding-bottom:8px;
    border-bottom:2px solid var(--ink);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .chap-head .cno{
    font-family:"Fraunces",serif; font-style:italic; font-weight:900;
    font-size:26px; color:var(--accent);
  }
  .chap-head h2{
    font-family:"Noto Serif TC",serif; font-weight:700; font-size:21px; margin:0;
    letter-spacing:-.2px;
  }
  .chap-head .cnt{font-size:12px; color:var(--muted); margin-left:auto;}

  /* ---- question card ---- */
  .q{
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    margin-top:18px; box-shadow:var(--shadow); overflow:hidden;
    position:relative;
  }
  .q.iswrong{border-left:4px solid var(--accent);}
  .q-top{padding:18px 22px 4px;}
  .q-meta{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .q-id{
    font-family:"Fraunces",serif; font-style:italic; font-weight:900;
    font-size:15px; color:var(--accent-deep);
    background:var(--paper2); border-radius:30px; padding:2px 12px;
  }
  .q-sec{font-size:12px; color:var(--muted); letter-spacing:.05em;}
  .badge{
    margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.06em;
    padding:3px 10px; border-radius:30px;
  }
  .badge.wrong{background:rgba(181,64,42,.12); color:var(--accent-deep); border:1px solid rgba(181,64,42,.3);}
  .badge.ok{background:rgba(61,107,74,.12); color:var(--green); border:1px solid rgba(61,107,74,.3);}
  .q-stem{
    font-family:"Noto Serif TC",serif; font-size:16.5px; font-weight:500;
    line-height:1.65; margin:2px 0 14px; color:var(--ink);
  }
  .opts{list-style:none; margin:0; padding:0 22px 4px;}
  .opt{
    display:flex; gap:12px; align-items:flex-start;
    padding:11px 14px; margin-bottom:8px; cursor:pointer;
    border:1px solid var(--line); border-radius:3px; background:var(--paper);
    transition:.13s; font-size:14.5px; line-height:1.55;
  }
  .opt:hover{border-color:var(--ink);}
  .opt .key{
    font-family:"Fraunces",serif; font-style:italic; font-weight:900;
    font-size:16px; width:22px; flex:none; text-align:center; color:var(--muted);
  }
  .opt.sel{background:#fff; border-color:var(--ink); box-shadow:inset 3px 0 0 var(--ink);}
  .opt.sel .key{color:var(--ink);}
  /* graded states */
  .q.graded .opt{cursor:default;}
  .q.graded .opt.correct{background:rgba(61,107,74,.1); border-color:var(--right); box-shadow:inset 3px 0 0 var(--right);}
  .q.graded .opt.correct .key{color:var(--right);}
  .q.graded .opt.missed{background:rgba(61,107,74,.05); border-style:dashed; border-color:var(--right);}
  .q.graded .opt.wrongpick{background:rgba(181,64,42,.1); border-color:var(--wrong); box-shadow:inset 3px 0 0 var(--wrong);}
  .q.graded .opt.wrongpick .key{color:var(--wrong);}
  .mark{margin-left:auto; font-size:12px; font-weight:700; flex:none; align-self:center;}
  .mark.g{color:var(--right);} .mark.r{color:var(--wrong);}

  .q-foot{padding:6px 22px 20px;}
  .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0 0;}
  .btn{
    font-family:"Noto Sans TC"; font-weight:700; font-size:13px; cursor:pointer;
    border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
    padding:9px 18px; border-radius:3px; transition:.15s;
  }
  .btn:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
  .btn.ghost{background:transparent; color:var(--ink);}
  .btn.ghost:hover{background:var(--paper2);}
  .btn[disabled]{opacity:.4; cursor:not-allowed;}

  .result-line{font-size:13px; font-weight:700; margin-left:4px;}
  .result-line.g{color:var(--right);}
  .result-line.r{color:var(--wrong);}

  .explain{
    margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;
    font-size:14px; line-height:1.7; color:#3a342b;
    display:none;
  }
  .q.graded .explain{display:block;}
  .explain .ans{
    font-family:"Fraunces",serif; font-style:italic; font-weight:900;
    color:var(--right); font-size:15px;
  }
  .explain .note{
    margin-top:9px; background:rgba(192,138,45,.12); border-left:3px solid var(--gold);
    padding:9px 13px; border-radius:0 3px 3px 0; font-size:13.5px; color:#5d4a22;
  }
  .explain .body{margin-top:9px; white-space:pre-line;}

  /* hidden by filter */
  .q.hide, .chap.hide{display:none;}

  footer{
    max-width:1040px; margin:0 auto; padding:24px 22px 60px;
    border-top:1px solid var(--line); color:var(--muted); font-size:12.5px;
    text-align:center;
  }

  /* sticky progress */
  .progress-bar{
    position:fixed; top:0; left:0; height:3px; background:var(--accent);
    width:0; z-index:50; transition:width .2s;
  }

  @media(max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .toggle{margin-left:0; width:100%;}
    .chap-head .cnt{display:none;}
  }
</style>
</head>
<body>
<div class="progress-bar" id="pbar"></div>

<header class="masthead">
  <div class="kicker">This is Service Design Thinking · 自測題庫</div>
  <h1 class="title">服務設計思考<span class="em"> 自測訓練</span></h1>
  <div class="subtitle">
    <span>涵蓋 <b>第 1–12 章</b> · 共 <b id="hcount"></b> 題多選題</span>
    <span>先作答 · 批改 · 看詳解</span>
    <span style="color:var(--accent-deep);font-weight:700;">標記 ◆ 為高頻易錯題</span>
  </div>
</header>

<section class="stats" id="stats"></section>

<div class="controls">
  <div class="seg" id="modeSeg">
    <button data-mode="quiz" class="on">自測模式 · 作答後批改</button>
    <button data-mode="study">解答模式 · 直接看詳解</button>
  </div>
  <div class="toggle">
    <span class="chip" id="wrongOnly">◆ 只看易錯題</span>
    <span class="chip" id="resetAll">清空我的作答</span>
  </div>
</div>

<div class="chapter-nav" id="chapNav"></div>

<main id="main"></main>

<footer>
  服務設計思考自測題庫 · 共 <span id="ftotal"></span> 題，其中 <span id="fwrong" style="color:var(--accent-deep);font-weight:700;"></span> 題為高頻易錯題。<br>
  可離線開啟 · 作答僅留存於你目前的瀏覽器畫面，重新整理即清空。
</footer>

<script>
(function(){
  const DATA = window.QUIZ_DATA;
  const main = document.getElementById('main');
  let mode = 'quiz';         // quiz(預設) | study
  let wrongOnly = false;
  const picks = {};          // qid -> Set of chosen keys
  const graded = {};         // qid -> true/false (是否答對)，供即時計分

  // ---- counts ----
  let total=0, wrongN=0, chapN=DATA.length;
  DATA.forEach(c=>c.questions.forEach(q=>{ total++; if(q.wrong) wrongN++; }));
  document.getElementById('ftotal').textContent=total;
  document.getElementById('fwrong').textContent=wrongN;
  document.getElementById('hcount').textContent=total;

  // ---- live score panel ----
  function renderStats(){
    const answered=Object.keys(graded).length;
    const correct=Object.values(graded).filter(Boolean).length;
    const acc = answered? Math.round(correct/answered*100):0;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${answered}<span style="font-size:16px;color:var(--muted)"> / ${total}</span></div><div class="l">已作答</div></div>
      <div class="stat" style="border-color:var(--right)"><div class="n" style="color:var(--right)">${correct}</div><div class="l">答對題數</div></div>
      <div class="stat ${acc>=80?'':'warn'}"><div class="n">${answered?acc+'%':'—'}</div><div class="l">本次正確率</div></div>
      <div class="stat"><div class="n">${wrongN}</div><div class="l">高頻易錯題</div></div>`;
  }

  // ---- chapter nav ----
  const nav=document.getElementById('chapNav');
  DATA.forEach((c,i)=>{
    const wc=c.questions.filter(q=>q.wrong).length;
    const a=document.createElement('a');
    a.href='#chap'+i; a.className='chip';
    a.innerHTML=`${c.chapter}${wc?` <span style="color:var(--accent)">◆${wc}</span>`:''}`;
    nav.appendChild(a);
  });

  function letterList(arr){return arr.join('、');}

  // ---- render ----
  function render(){
    main.innerHTML='';
    DATA.forEach((c,ci)=>{
      const visQ = c.questions.filter(q=>!wrongOnly || q.wrong);
      if(!visQ.length) return;
      const sec=document.createElement('section');
      sec.className='chap'; sec.id='chap'+ci;
      const wc=c.questions.filter(q=>q.wrong).length;
      sec.innerHTML=`<div class="chap-head">
        <span class="cno">${c.chapter.replace('第','').replace('章','')||'·'}</span>
        <h2>${c.title}</h2>
        <span class="cnt">${visQ.length} 題${wc?` · ◆ ${wc} 題易錯`:''}</span></div>`;
      visQ.forEach(q=>sec.appendChild(qCard(q)));
      main.appendChild(sec);
    });
    if(!main.children.length){
      main.innerHTML='<p style="text-align:center;color:var(--muted);margin:60px 0;font-family:Noto Serif TC,serif;">沒有符合條件的題目。</p>';
    }
    renderStats();
  }

  function qCard(q){
    const card=document.createElement('div');
    card.className='q'+(q.wrong?' iswrong':'');
    card.dataset.qid=q.id;
    const sel = picks[q.id] || new Set();

    const optsHtml = Object.entries(q.options).map(([k,v])=>{
      return `<li class="opt" data-k="${k}"><span class="key">${k}</span><span class="otxt">${v}</span></li>`;
    }).join('');

    const noteHtml = q.note? `<div class="note">💡 易錯提醒：${q.note}</div>`:'';
    // 「多選」提示：正解超過 1 個就標示，幫助作答者
    const multiHint = q.correct.length>1? '（複選）':'（單選或複選）';

    card.innerHTML=`
      <div class="q-top">
        <div class="q-meta">
          <span class="q-id">${q.id}</span>
          <span class="q-sec">${q.section}</span>
          ${q.wrong?'<span class="badge wrong">◆ 高頻易錯</span>':''}
        </div>
        <div class="q-stem">${q.stem} <span style="font-size:12px;color:var(--muted);font-weight:400">${multiHint}</span></div>
      </div>
      <ul class="opts">${optsHtml}</ul>
      <div class="q-foot">
        <div class="actions">
          <button class="btn submit">批改作答</button>
          <button class="btn ghost reset" style="display:none">重作這題</button>
          <span class="result-line"></span>
        </div>
        <div class="explain">
          <div class="ans">正解：${letterList(q.correct)}</div>
          ${noteHtml}
          <div class="body">${q.explain}</div>
        </div>`;

    const optEls=[...card.querySelectorAll('.opt')];
    const submitBtn=card.querySelector('.submit');
    const resetBtn=card.querySelector('.reset');
    const resLine=card.querySelector('.result-line');

    sel.forEach(k=>{const el=card.querySelector(`.opt[data-k="${k}"]`); if(el)el.classList.add('sel');});

    function selectable(){ return mode==='quiz' && !card.classList.contains('graded'); }

    optEls.forEach(el=>{
      el.addEventListener('click',()=>{
        if(!selectable())return;
        const k=el.dataset.k;
        const s=picks[q.id]||(picks[q.id]=new Set());
        if(s.has(k)){s.delete(k); el.classList.remove('sel');}
        else{s.add(k); el.classList.add('sel');}
      });
    });

    function markUp(){
      const chosen = picks[q.id]||new Set();
      const correct=new Set(q.correct);
      let allRight=true;
      optEls.forEach(el=>{
        const k=el.dataset.k;
        const isC=correct.has(k), isP=chosen.has(k);
        if(isC&&isP){el.classList.add('correct'); el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">✓ 該選</span>');}
        else if(isC&&!isP){el.classList.add('missed'); el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">＋ 漏選</span>'); allRight=false;}
        else if(!isC&&isP){el.classList.add('wrongpick'); el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark r">✗ 不該選</span>'); allRight=false;}
      });
      return allRight;
    }

    function grade(){
      // 沒選任何選項時提示
      const chosen = picks[q.id]||new Set();
      if(chosen.size===0){
        resLine.textContent='請先點選你的答案';
        resLine.className='result-line r';
        return;
      }
      card.classList.add('graded');
      const allRight=markUp();
      graded[q.id]=allRight;                 // 記錄這位作答者的結果
      resLine.textContent = allRight? '✓ 全對！' : '✗ 看下方詳解';
      resLine.className='result-line '+(allRight?'g':'r');
      submitBtn.style.display='none';
      resetBtn.style.display='';
      renderStats();
    }

    submitBtn.addEventListener('click',grade);
    resetBtn.addEventListener('click',()=>{
      card.classList.remove('graded');
      picks[q.id]=new Set();
      delete graded[q.id];
      optEls.forEach(el=>{el.classList.remove('sel','correct','missed','wrongpick'); const m=el.querySelector('.mark'); if(m)m.remove();});
      submitBtn.style.display=''; resetBtn.style.display='none'; resLine.textContent='';
      renderStats();
    });

    function applyMode(){
      if(mode==='study'){
        // 解答模式：直接顯示正解（不影響作答者的計分）
        card.classList.add('graded');
        submitBtn.style.display='none'; resetBtn.style.display='none'; resLine.textContent='';
        const correct=new Set(q.correct);
        optEls.forEach(el=>{
          el.classList.remove('sel','wrongpick','missed','correct');
          const m=el.querySelector('.mark'); if(m)m.remove();
          if(correct.has(el.dataset.k)){el.classList.add('correct'); el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">✓ 正解</span>');}
        });
      }else{
        // 自測模式：若這題作答者已批改過，沿用其結果；否則維持未作答、詳解隱藏
        optEls.forEach(el=>{el.classList.remove('correct','missed','wrongpick'); const m=el.querySelector('.mark'); if(m)m.remove();});
        if(q.id in graded){
          card.classList.add('graded');
          const allRight=markUp();
          resLine.textContent = allRight? '✓ 全對！' : '✗ 看下方詳解';
          resLine.className='result-line '+(allRight?'g':'r');
          submitBtn.style.display='none'; resetBtn.style.display='';
        }else{
          card.classList.remove('graded');
          submitBtn.style.display=''; resetBtn.style.display='none'; resLine.textContent='';
        }
      }
    }
    applyMode();
    return card;
  }

  // ---- mode switch ----
  document.querySelectorAll('#modeSeg button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      mode=b.dataset.mode;
      render();
    });
  });

  // ---- wrong-only ----
  const wo=document.getElementById('wrongOnly');
  wo.addEventListener('click',()=>{ wrongOnly=!wrongOnly; wo.classList.toggle('on',wrongOnly); render(); });

  // ---- reset all answers ----
  document.getElementById('resetAll').addEventListener('click',function(){
    for(const k in picks) delete picks[k];
    for(const k in graded) delete graded[k];
    this.classList.add('on'); setTimeout(()=>this.classList.remove('on'),500);
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });

  // ---- progress bar ----
  window.addEventListener('scroll',()=>{
    const h=document.documentElement;
    const p=(h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;
    document.getElementById('pbar').style.width=p+'%';
  });

  render();
})();
</script>
</body>
</html>
