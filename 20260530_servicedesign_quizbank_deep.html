    {h: "多面向綜合體與迷思破除", b: "服務設計不僅是流程，更是全員具備的「心態 (Mindset)」、打破穀倉的「跨領域語言」，以及重新分配資源的「管理手法」。它不是單純的客戶服務，不是事後發折價券的補救策略，更不是用來掩蓋劣質產品的遮羞布。"},
    {h: "有形化 (Evidencing)", b: "服務通常是無形的。服務設計的一大任務，是創造具體的「實體證據」，讓顧客能明確感知到服務的價值與企業的承諾。"},
    {h: "服務設計的新原則", b: "以人為本（含所有利害關係人）、協作且迭代的（跨領域共創、循環測試）、連續的（時間序列上相互關聯的事件）、真實的（在真實場域檢視、無形化為有形證據）、全面的（關注整個生態系的實體與數位接觸點）。"},
    {h: "服務設計十二誡", b: "(1) 糾結服務設計這個稱呼本身；(2) 覺得初版要完美；(3) 設計者被動；(4) 多說少做；(5) 在不正確時間點發散或收斂；(6) 先想解決方案才回推問題；(7) 在過度虛擬的場域做原型；(8) 雞蛋放在同個籃子裡；(9) 使用工具凌駕於改變結果；(10) 僵化；(11) 輕忽細節只在乎整體；(12) 沒有把「服務」刻在骨子裡。"}

  aiInsight: "服務設計產出的視覺化圖表（如藍圖），其最大價值往往不在於「圖表本身」，而在於大家為了畫出這張圖，所促成的「跨部門對話與共識」。",
  scenarios: [
    {role: "講求效率的日班咖啡店長", q: "每天光是出杯都來不及了，為什麼總部還要我花時間去記錄客人排隊時看菜單的視線方向？這不是很浪費時間嗎？", a: "這是為了避免落入十二誡中的「輕忽細節只在乎整體」。你專注於出杯速度（整體效率），但如果客人因為菜單排版不良而猶豫不決，這微小的摩擦就會拖慢整個隊伍。服務設計要求我們具備「全面的」視角，因為細節往往決定了最終的體驗成敗。", note: "管理者效率視角，點出忽略微小接觸點正是十二誡所警告的盲點。"},
    {role: "敏銳且注重品質的夜班常客", q: "我覺得你們店裡的氣氛有時候會突然斷掉，像是我剛剛聽完一場很棒的脫口秀，結果走到吧台點酒時，燈光突然變得超亮、音樂也停了，感覺很解嗨。", a: "您的反饋非常精準。這顯示我們的服務缺乏「連續的 (Sequential)」原則。服務設計不只關注單一接觸點，更關注這些事件之間隨時間推移的過渡與銜接。燈光與音樂的突兀切換，就是未能將體驗視為連續事件所產生的斷層。", note: "敏銳常客視角，闡述「連續的」原則在時間軸過渡上的重要性。"},
    {role: "滿頭大汗的外部酒水供應商", q: "你們測試新冰箱的動線，為什麼非得要我挑禮拜五晚上營業尖峰時段親自搬一箱啤酒進來測？在白天店休時測不行嗎？", a: "因為服務設計的新原則強調必須是「真實的 (Real)」，且十二誡也提醒我們不可「在過度虛擬的場域做原型測試」。白天店休的空間是空的，無法模擬夜晚客人擠滿走道時的真實阻力。唯有在真實情境中驗證，才能確保設計出的動線經得起實戰考驗。", note: "外部夥伴視角，客觀說明「真實的」原則與避免虛擬測試的必要性。"}

  theory: {
    name: "服務主導邏輯 & 信任與承諾模型",
    intro: "服務主導邏輯 (Service-Dominant Logic, SDL) 由 Vargo & Lusch 提出。打破傳統「商品主導（單向賣斷商品）」的觀念，認為所有經濟活動的本質都是「服務的交換」。企業無法單獨創造價值，只能提供「價值主張」，真正的價值是在顧客實際使用的脈絡中「共創 (Co-creation)」出來的（即使用中價值 Value-in-use）。信任與承諾模型 (Commitment-Trust Theory) 由 Morgan & Hunt 提出，主張「信任 (Trust)」與「承諾 (Commitment)」是維持長期合作與顧客忠誠度的中介變數。",
    commentary: "SDL 重定義了價值的來源，為「以人為本」與「協作」原則奠定基礎，證實實體商品僅是傳遞服務體驗的載體。信任與承諾模型則量化了違反「十二誡」（如：多說少做、僵化）的長期成本；在高度競爭的商業環境中，若未能維持「連續且真實」的服務品質，將直接侵蝕顧客的信任資產，導致關係承諾瓦解。",
    miniInsight: "SDL 跟 PZB 看起來在講不同的事，其實是同一枚硬幣的兩面：PZB 在問「我有沒有把承諾的東西交出去」，SDL 在問「我交出去的東西，顧客用得起來嗎」。十二誡裡每一誡，幾乎都對應到信任資產的某種特定損耗方式。"
  },
  questions: [
    {id: "2-1", section: "多面向（純理論）",
     stem: "將服務設計視為「多面向」綜合體，下列哪些論述符合書中觀點？",
     options: {A: "視為「管理手法」時，主要強調透過有系統的流程變革，調整組織內部資源分配效率。", B: "視為「跨領域語言」時，是為了讓行銷、IT、設計、營運等背景人員，能透過共同視覺化工具溝通。", C: "視為「心態 (Mindset)」時，不僅是專家的工作，而是鼓勵組織內所有人都具備以使用者為中心的同理心。", D: "定義為「流程」時，它是一套不可更改的嚴格線性步驟，必須從頭執行到尾，不可反覆修正。", E: "多面向特性意味著它必須具備「實體化 (Tangibilization)」能力，將無形服務體驗轉化為可見的具體物件或流程。"},
     correct: ["A","B","C","E"],
     explain: "管理手法 (A)、跨領域語言 (B)、心態 (C)、實體化 (E) 皆為多面向的合理面向。D 把流程定義為僵化線性步驟，違背迭代精神。", deepNote: "多面向是學者的描述，但實務上有個快速測試：當你的團隊在吵架時，吵的是「流程怎麼跑」（流程面）、「該不該優先做這個」（管理面）、還是「為什麼要這樣對待顧客」（心態面）？吵在哪一層，就要從哪一層動手。"},
    {id: "2-2", section: "情境：工具 × 心態（輕情境）",
     stem: "哪種做法能體現服務設計作為「工具」與「心態」的結合？",
     options: {A: "單純聘請設計師重新裝潢，只要視覺夠美，就完成了服務設計。", B: "建立服務 SOP，要求員工強迫背誦，確保對任何顧客都給予一模一樣的機械式回應。", C: "使用「顧客旅程地圖」與團隊共同盤點顧客從訂位到離店的每個情緒轉折，作為持續優化依據。", D: "要求行銷與營運團隊共同參與「使用者訪談」，讓技術人員也理解顧客在現場的痛點。", E: "為省成本直接買市面最便宜的標準化軟體，即使無法配合經營策略，也強迫團隊與顧客去適應它。"},
     correct: ["C","D"],
     explain: "旅程地圖共創 (C)、跨部門訪談培養同理心 (D) 結合了工具與心態。A 純裝潢、B 死板 SOP、E 工具凌駕結果皆為迷思。", deepNote: "工具只是行為的捷徑，心態才是行為的源頭。沒有心態的工具會變成「畫了漂亮旅程圖給董事會看，但實際上沒人改變做事方式」——這就是十二誡裡「使用工具凌駕於改變結果」的具體場景。"},
    {id: "2-3", section: "破除迷思（純理論）",
     stem: "關於「服務設計不是什麼」，下列哪些觀點正確？",
     options: {A: "服務設計就是客戶服務 (Customer Service)：它是在處理顧客投訴的具體行為。", B: "服務設計不是遮羞布：它不能拿來掩蓋企業本身的劣質產品或有毒的商業模式。", C: "服務設計不是補救策略：它應在服務發生前就規劃，而非等到問題發生才修補。", D: "服務設計其實就是「行銷廣告包裝」，目的是透過美化包裝誘導顧客初次消費。", E: "服務設計強調從全貌出發，不是單一部門的單打獨鬥，而是需要跨部門協作。"},
     correct: ["B","C","E"],
     explain: "不是遮羞布 (B)、不是補救策略 (C)、需跨部門協作 (E)。A 混同為客服、D 混同為行銷包裝皆為書中明確破除的迷思。", deepNote: "三種誤解可以這樣分類：「不是客服」是時機誤解（事後 vs. 事前）、「不是補救策略」是手段誤解（修補 vs. 預防）、「不是遮羞布」是動機誤解（掩蓋 vs. 解決）。下次聽到「我們也在做服務設計啊」，先確認對方踩在哪種迷思上。"},
    {id: "2-4", section: "情境：客訴風波（輕情境）",
     stem: "酒吧遭遇嚴重客訴時，哪種決策屬於「正確的服務設計觀點」而非迷思？",
     options: {A: "當成遮羞布，快速請行銷寫感人道歉文並加強修圖廣告以轉移視線。", B: "當成補救策略，僅在客訴當下給禮品券，而不重新審視整個服務流程是否有系統性缺陷。", C: "承認服務設計不是客服，因此不僅安撫客人，還運用服務設計思考重新檢視流程藍圖，找出問題根源。", D: "視為心態，要求所有員工（含廚房後勤）共同探討客訴背後的系統性問題，而非僅指責前線服務生。", E: "服務設計既然不是客服，那就完全不必理會客人情緒投訴，專心在設計藍圖上即可。"},
     correct: ["C","D"],
     explain: "重新檢視藍圖 (C)、全員探討系統問題 (D) 才是正確觀點。A 當遮羞布、B 不改流程、E 漠視情緒皆為迷思。", deepNote: "服務設計的客訴觀，跟傳統客戶服務最大差別是時間軸：傳統客服只處理「已發生」，服務設計處理「未來如何不發生」。同一個客訴，這兩種思維會做出截然不同的決策——一個是發折價券了事，一個是重新設計流程。"},
    {id: "2-5", section: "服務設計切勿犯的錯誤（純理論）",
     stem: "在實務推動上，關於服務設計常陷入的迷思或陷阱，下列敘述哪些正確？",
     options: {A: "「覺得初版要完美」會導致團隊陷入過度規劃的泥沼，違背了敏捷測試與迭代的精神。", B: "「先想解決方案才回推問題」是一種高效的創新捷徑，能大幅縮短專案的開發週期。", C: "「在過度虛擬的場域做原型測試」可能導致數據失真，因為它忽略了真實脈絡中的物理限制與情緒變數。", D: "「使用工具凌駕於改變結果之上」提醒團隊，畫出精美的藍圖本身不是目的，促成組織變革才是核心。", E: "為了避免「多說少做」，設計師應該跳過所有的前置研究，直接進入程式碼開發階段。"},
     correct: ["A","C","D"],
     explain: "初版求完美陷阱 (A)、虛擬場域失真 (C)、工具不可凌駕結果 (D) 皆為十二誡警示。B 倒推解方、E 跳過研究皆是錯誤詮釋。", deepNote: "十二誡中最容易犯的不是「初版要完美」（過度規劃），而是「先想解決方案才回推問題」（倒果為因）。團隊往往抱著「我們就是要做這個 LineBot」的預設答案開會，卻假裝在做使用者研究——這種偏誤連自己都察覺不到。"},
    {id: "2-6", section: "理論擴充：服務主導邏輯（純理論）",
     stem: "關於「服務主導邏輯 (Service-Dominant Logic)」的核心概念，下列敘述哪些正確？",
     options: {A: "認為企業在工廠中製造出價值，並在交易時單向傳遞給顧客。", B: "所有的經濟交換行為，其本質都是為了獲得「服務」，實體商品只是傳遞服務的載體。", C: "企業只能提出「價值主張 (Value Proposition)」，真正的價值必須透過顧客實際使用才能實現。", D: "顧客是價值的「共同創造者 (Co-creator)」，而非被動的接收端。", E: "服務設計的迭代原則，完全違背了服務主導邏輯中關於共創的定義。"},

    {id: "2-7", section: "理論擴充：信任與承諾模型（純理論）",
     stem: "依據關係行銷中的「信任與承諾模型 (Commitment-Trust Theory)」，下列敘述哪些正確？",
     options: {A: "信任與承諾是維繫買賣雙方長期互惠關係的最關鍵中介變數。", B: "信任的建立，建立在企業能持續展現可靠性與高度的服務標準之上。", C: "只要單次交易的價格夠低，即使破壞信任，顧客依然會給予長期的關係承諾。", D: "若企業犯了「多說少做」的服務設計十二誡，將嚴重損害關係行銷中的信任基礎。", E: "承諾代表顧客願意為了維持有價值的關係，而付出短期的努力或成本。"},

    {id: "2-8", section: "理論與情境結合：雙棲空間的關係承諾（輕情境）",
     stem: "店家主打「日間高效辦公、夜間釋放壓力」的雙棲空間體驗，吸引了許多自由工作者成為常客。若要依據「信任與承諾模型」維繫這群高黏著度顧客，並符合服務設計的新原則，下列分析哪些正確？",
     options: {A: "依據服務主導邏輯，這群顧客重視的不是單純的實體桌椅，而是在此空間中獲得的「高效率與放鬆的價值共創」。", B: "若日間轉夜間的清場交接頻繁失誤，導致顧客在辦公時不斷被干擾，這種「不連續」的體驗將直接破壞信任基礎。", C: "為避免犯下十二誡中的「僵化」，店家應觀察這群常客的真實行為，彈性調整日夜時段的消費折抵方案。", D: "只要提供全區最便宜的單品咖啡，即便洗手間經常髒亂（忽視細節），自由工作者依然會給予高度的品牌承諾。", E: "企業對外發布的價值主張，必須透過「有形化」的真實體驗來兌現，才能建立可靠的長期信任。"},

    {h: "雙鑽石流程 (Double Diamond)", b: "由英國設計委員會提出。第一顆鑽石「探索與定義（問題空間）」旨在做正確的事（找對真正的痛點）；第二顆鑽石「發展與交付（解決方案空間）」旨在把事情做正確（執行對的解法）。"},

  aiInsight: "雙鑽石模型在圖紙上看起來是線性的，但在實務上，它是一個充滿混亂與回溯的「非線性」循環。提早失敗（在原型階段），才能避免在落實階段面臨災難性的崩盤。",
  scenarios: [
    {role: "充滿創意的日班咖啡師", q: "開會討論夏季新菜單時，我剛提議『咖啡加氣泡水』，夜班酒保馬上插嘴說『但是這樣氣泡機耗損率太高』，結果大家都不講話了，該怎麼辦？", a: "這是因為你們在錯誤的時間點進行了收斂。在腦力激盪的「發散」脈絡中，應該嚴格規定只能使用「對，而且... (Yes, and...)」來疊加點子（例如：對，而且我們可以加一片檸檬）。等到點子夠多，進入「收斂」脈絡時，才能使用「對，但是... (Yes, but...)」來評估設備耗損。", note: "基層員工視角，帶出「對，而且」與「對，但是」交替應用的時機。"},
    {role: "焦慮的夜班脫口秀經理", q: "上個月的『單口喜劇新人夜』專案明明已經跑完所有階段並且順利結案了，為什麼這禮拜觀眾人數又下滑？我們不是已經設計好完美流程了嗎？", a: "這凸顯了傳統專案管理的線性迷思。服務設計探討的是「核心活動」而非單向「階段」。因為商業環境與觀眾口味是動態的，這些活動具備強烈的「循環性 (Cyclical)」。專案上線（交付）只是下一個測試的開始，你必須重新啟動「探索」活動，找出新的痛點。", note: "經理視角，破除「做完即結案」的線性迷思。"},
    {role: "實事求是的社群行銷企劃", q: "老闆要我立刻寫一個『掃碼送免費 Shot』的精美互動網頁來提振業績，但我發現客人其實是抱怨廁所太少、排隊太久。我該照做，還是先解決廁所問題？", a: "請運用雙鑽石模型第一階段「做正確的事 (Do the right thing)」的精神。如果源頭的痛點（廁所排隊）沒有解決，你直接跳到第二階段去「把事情做正確 (Do things right)」寫出完美的網頁，也是徒勞無功。退回探索與定義，找出真正的問題核心。", note: "執行者視角，具象化「做正確的事」與「把事情做正確」的先後邏輯。"}

  theory: {
    name: "雙鑽石模型 & 經驗學習理論",
    intro: "雙鑽石模型 (Double Diamond Model) 由英國設計委員會 (Design Council) 提出，模型分為兩個菱形：左鑽石為「問題空間 (Problem Space)」，涵蓋探索與定義；右鑽石為「解決方案空間 (Solution Space)」，涵蓋發展與交付。每個鑽石皆包含一次「發散」與「收斂」的完整擴張與聚焦過程。經驗學習理論 (Experiential Learning Theory, ELT) 由 Kolb 提出，主張學習是透過轉化經驗來創造知識的過程，包含四個循環步驟：具體經驗、反思觀察、抽象概念化與主動實驗。",
    commentary: "雙鑽石模型不僅是流程，更是管理創新複雜度的思維框架，它嚴格界定了何時該天馬行空、何時該務實評估。而 Kolb 的經驗學習理論，則為服務設計「核心活動的循環性」與「原型測試」提供了心理學基礎。在實務上，團隊不能只停留在會議室裡的「抽象概念化」，必須將點子化為原型進入現場「主動實驗」，再透過顧客反饋獲得「具體經驗」。",
    miniInsight: "雙鑽石的精髓不在於「兩顆鑽石」這個形狀，而是「強制把問題空間和解決方案空間切開」。多數團隊失敗的原因不是不會想點子，而是還沒搞清楚問題，就急著想解決方案——也就是 Kolb 講的「跳過反思觀察直接做主動實驗」。"
  },
  questions: [
    {id: "4-1", section: "雙鑽石流程基礎（純理論）",
     stem: "關於「雙鑽石模型 (Double Diamond)」，下列哪些敘述正確？",
     options: {A: "第一個鑽石（探索與定義）重點在「做正確的事」，第二個鑽石（發展與交付）重點在「把事情做正確」。", B: "雙鑽石是線性的，一旦進入第二鑽石的「發展」階段，就嚴禁再回到第一鑽石進行任何研究或定義。", C: "發散階段 (Divergence) 的目的是盡可能廣泛地搜集資訊或創意，不做任何批判。", D: "收斂階段 (Convergence) 的目的是透過篩選、聚焦，找出最具潛力的洞察或解決方案。", E: "雙鑽石流程暗示服務設計是一個具備循環性的動態過程，而非單一的起點與終點。"},
     correct: ["A","C","D","E"],
     explain: "做正確的事與把事做正確 (A)、發散不批判 (C)、收斂聚焦 (D)、循環動態 (E)。B 線性禁止回頭，違反非線性循環的核心精神。", deepNote: "雙鑽石模型的左右兩鑽不只是流程切分，更是兩種「思考模式」的切換：左鑽是發散思維（擴展可能性），右鑽是收斂思維（聚焦可行性）。團隊裡常有「天生的左鑽人」和「天生的右鑽人」，知道誰擅長什麼，能省下很多無效爭執。"},
    {id: "4-2", section: "核心活動與循環性（純理論）",
     stem: "為何服務設計領域強調用「核心活動 (Core Activities)」一詞來取代傳統專案管理的「階段 (Phases)」？",
     options: {A: "因為「階段」一詞暗示了單向、線性的進程，一旦完成某階段就直接結案，無法反映真實的設計生態。", B: "因為「核心活動」強調了服務設計的「循環性 (Cyclical)」，上線營運往往是下一次研究探索的起點。", C: "因為只有稱為活動，才能向企業高層申請到更多的專案開發預算。", D: "提醒團隊，服務環境與顧客需求是動態變化的，因此探索、定義、發展與交付的動作必須反覆迭代。", E: "因為核心活動不需要任何收斂過程，可以無限期地發散下去。"},
     correct: ["A","B","D"],
     explain: "階段暗示單向 (A)、活動強調循環 (B)、反映動態變化 (D)。C 為預算申請而改名、E 認為無需收斂皆錯。", deepNote: "學界改用「核心活動」這個詞，在語意上做了一件大事：把「結束」這個概念從服務開發中刪除。沒有「結束」，只有「下一輪」——這個語言上的改動，徹底改變了專案管理的心智模型。"},
    {id: "4-3", section: "發想與原型關聯（純理論）",
     stem: "關於「概念發想」與「原型測試」的關聯，下列哪些敘述正確？",
     options: {A: "發想階段應鼓勵團隊提出天馬行空的想法，有助於跳脫既有的穀倉效應。", B: "原型測試應在概念發想結束後，立即進行大規模軟硬體開發，以展示專業度。", C: "原型的核心功能是將「隱性的概念」轉化為「顯性的互動體驗」，以便快速評估。", D: "若原型測試結果與初期假設不符，應忽略不符合預期的數據，確保企劃按原訂時間表執行。", E: "原型測試的價值在於作為一個「對話界面」，邀請顧客參與設計過程。"},
     correct: ["A","C","E"],
     explain: "天馬行空破穀倉 (A)、隱性轉顯性 (C)、對話界面 (E)。B 大規模開發、D 忽略數據皆違背原型精神。", deepNote: "「原型是用來發問的工具」這句話可以延伸：你的原型品質好不好，看「它能讓你問出什麼新問題」。如果原型測完只能回答「客人喜歡 vs. 不喜歡」，那原型還不夠精準；好的原型測完之後，你會有十個新的待測假設。"},
    {id: "4-4", section: "系統落實的挑戰（純理論）",
     stem: "關於服務設計的「落實 (Implementation)」活動，哪些觀點能提升專案的存活率與專業度？",
     options: {A: "落實僅是技術或工程部門的事，行銷與設計團隊在原型確認後就可功成身退。", B: "落實需要建立持續優化的機制，因為服務體驗在實際營運後會因環境變數產生新摩擦。", C: "落實階段不應再進行任何變更，以確保現場運作的絕對標準化與零誤差。", D: "應將「組織文化與科技接受度」納入落實考量，確保員工理解為何要導入這套新流程。", E: "落實是服務設計的最後一步，完成後團隊就不再需要具備「研究」與「發想」的思維。"},
     correct: ["B","D"],
     explain: "持續優化機制 (B)、納入組織文化 (D)。A 限縮為技術部門、C 絕對標準化扼殺彈性、E 不需研究發想思維皆錯。", deepNote: "落實階段最容易被忽略的一誡：「服務設計師有一半的時間其實在做變革管理」。畫圖只佔 20%，剩下 80% 是說服、教育、共識、心理建設——這是很多初入行的設計師沒準備好的真相。"},
    {id: "4-5", section: "發散與收斂（情境）",
     stem: "將「發散與收斂」運用到「AI 線上客服系統」開發，哪些作法符合此邏輯？",
     options: {A: "[發散] brainstorm 列出所有顧客可能問的問題（脫口秀資訊、酒水成份、訂位查詢、抱怨、撩酒保）。", B: "[收斂] 根據資源與最重要痛點，精簡為「訂位、酒單查詢、表演時間」三大核心功能。", C: "[發散] 為追求完美，同時開發語音、打字、視訊、表情符號解析四種交互介面。", D: "[收斂] 針對 MVP 版本，剔除暫時不需要的複雜功能，確保 LINE Bot 穩定運作。", E: "[發散] 為了讓系統看起來更先進，不經收斂篩選，直接將所有 Gemini API 功能全部灌入 Bot。"},
     correct: ["A","B","D"],
     explain: "發散列出可能性 (A)、收斂精簡核心 (B)、MVP 收斂 (D)。C 與 E 都是「只發散不收斂」的盲目堆疊陷阱。", deepNote: "發散與收斂的時機常被搞混：很多人把「發散時直接挑出三個」當成收斂，這其實是「過早收斂」。真正的收斂需要先把所有點子並列攤平，再用客觀標準排序——少了「攤平」這一步，收斂會偏向最會說話的人的偏好。"},
    {id: "4-6", section: "理論擴充：雙鑽石與語境思維（純理論）",
     stem: "結合雙鑽石模型與團隊溝通語境，下列關於「發散」與「收斂」的配對與敘述，哪些正確？",
     options: {A: "在發散階段，團隊應採取「對，而且... (Yes, and...)」的語法，鼓勵將點子建構在別人的想法之上。", B: "在收斂階段，為了快速過濾選項，團隊應切換至「對，但是... (Yes, but...)」的語法，帶入理性評估與資源限制。", C: "雙鑽石模型的左鑽石（探索與定義）完全不需要收斂，只要無止盡地發掘痛點即可。", D: "將「對，但是...」提早用在發散階段，能有效避免天馬行空的創意，是服務設計極力推崇的做法。", E: "區分這兩種語境的目的，是為了營造「延遲批判」的安全空間，確保創意不會過早被扼殺。"},
     correct: ["A","B","E"],
     explain: "發散用 Yes and (A)、收斂用 Yes but (B)、延遲批判 (E)。C 否認左鑽石需要收斂、D 把過早收斂視為推崇皆錯。", deepNote: "\"Yes, and...\" vs. \"Yes, but...\" 不只是工作坊技巧，是兩種完全不同的認知模式。\"Yes, and...\" 在腦中繼續疊加可能性（建設性思維），\"Yes, but...\" 啟動篩選過濾器（評估性思維）。同時開兩個模式會互相干擾，所以時間上要嚴格切分。"},
    {id: "4-7", section: "理論擴充：經驗學習理論（純理論）",
     stem: "依據 Kolb 的「經驗學習理論 (Experiential Learning Theory)」，下列敘述哪些正確且能對應服務設計精神？",
     options: {A: "學習是透過單純閱讀理論手冊即可完成的過程，不需要進入真實情境。", B: "服務原型測試對應了理論中的「主動實驗」，目的是為了在現場獲取真實的「具體經驗」。", C: "在觀察完顧客痛點後，團隊召開跨部門會議進行「反思觀察」與「抽象概念化」，是將零散資料轉化為洞察的關鍵步驟。", D: "經驗學習理論完美解釋了為何服務設計必須是「循環的」：因為實驗帶來新經驗，新經驗又會促發下一輪的反思與優化。", E: "理論主張，只要概念化做得夠完美，就不需要再浪費成本進行主動實驗。"},
     correct: ["B","C","D"],
     explain: "原型對應主動實驗 (B)、跨部門反思與概念化 (C)、循環迭代 (D)。A 否認真實情境、E 跳過主動實驗皆違反 ELT 核心。", deepNote: "Kolb 的四步驟（具體經驗→反思觀察→抽象概念化→主動實驗）很多人忽略了「反思觀察」這一步。團隊常在看到數據後直接跳到做新版本，跳過了反思——這就是為什麼很多 A/B test 跑了一堆，學到的卻很少。"},
    {id: "4-8", section: "理論與情境結合：白咖夜酒的菜單改版（輕情境）",

     options: {A: "團隊在會議前半段採用「對，而且...」進行發想，激盪出「將濃縮咖啡與黑生啤結合」等多項創意。", B: "會議進入後半段決策時，店長要求大家切換至「對，但是...」思維，冷靜評估混合飲料在尖峰時段的出杯效率。", C: "為了確保一次成功，團隊決定跳過任何「主動實驗（原型測試）」，直接花十萬元將新菜單印製成精裝本。", D: "新菜單上線後，團隊認知到這是「核心活動」的循環，持續追蹤點餐數據，並準備根據新的具體經驗進行下一次迭代。", E: "發現白天顧客對新菜單感到困惑時，團隊認為「交付階段」已結束，拒絕重新回到「探索」活動了解顧客困惑的原因。"},
     correct: ["A","B","D"],
     explain: "發散用 Yes and (A)、收斂用 Yes but (B)、循環迭代 (D)。C 跳過原型、E 拒絕回到探索皆是線性思維陷阱。", deepNote: "菜單改版是個經典的雙鑽石迭代場景：第一鑽找「客人真正想要的飲品方向」，第二鑽找「在我們的設備限制下能做出來的最佳版本」。直接跳進第二鑽（畫菜單）的團隊，往往做出一份精美但客人不買單的菜單。"}

    {h: "桌上研究 (Desk Research)", b: "蒐集次級資料的起點。能幫助團隊在進行昂貴的實地調查前，先過濾掉無效方向，但無法取代實地訪談。"},
    {h: "民族誌與沉浸式體驗", b: "民族誌的核心精神在於研究員必須具備「實際的沉浸式體驗」。自傳式民族誌 (Auto-ethnography) 由研究者親自扮演顧客；線上虛擬民族誌 (Netnography) 將沉浸式觀察延伸至數位社群。"},
    {h: "民族誌的變體應用", b: "購物神秘客 (Mystery Shopper)：以暗訪形式客觀記錄服務流程；秘密員工 (Undercover Employee)：研究員隱藏身分進入組織內部工作；日誌研究 (Diary Studies)：讓使用者在一段時間內自行記錄行為與感受。"},
    {h: "共創工作法與研究應用邏輯", b: "透過視覺化工具讓跨部門共同參與分析。方法的選擇必須根據「想回答的問題」來決定，且蒐集到的資料必須轉化為「洞察 (Insights)」才有價值。"}
  ],
  aiInsight: "服務設計的研究不是為了解出「絕對客觀的標準答案」，而是為了挖掘出「使用者自己都沒察覺的行為動機」。因此，主觀的感受在經過有系統的反思後，往往是最珍貴的數據。",
  scenarios: [
    {role: "滿臉狐疑的白咖夜酒老闆", q: "為什麼你要派一個研究員假裝成工讀生，來我們晚班吧台洗一個禮拜的杯子？直接看監視器不就知道出餐哪裡卡住了嗎？", a: "監視器只能看到表象動作，無法捕捉真實的痛點。這叫做「秘密員工 (Undercover Employee)」，是民族誌的一種變體。只有讓研究員具備實際的「沉浸式體驗」，親自感受洗杯機故障時被外場催促的壓力，我們才能抓出導致員工流動率高的真實服務缺口。", note: "管理者視角，對比監視器表象與沉浸式體驗的深度差異。"},
    {role: "重度依賴手機的夜貓常客", q: "我每天都在你們的 IG 粉絲團潛水看大家的留言，你們居然能從那些零碎的動態和匿名投票中，精準猜出我今晚想喝什麼特調？", a: "這歸功於我們運用了「線上虛擬民族誌 (Netnography)」。我們不只在實體店面觀察，研究員更沉浸在你們的數位社群中，分析留言的語氣與互動文化。這讓我們能提前掌握顧客在虛擬空間中透露的真實偏好。", note: "數位社群常客視角，具象化線上虛擬民族誌的研究價值。"},
    {role: "務實冷靜的外部市調員", q: "要了解白天把這裡當工作室的自由工作者都在想什麼，直接發一份線上問卷不就好了？為什麼還要付費請他們寫一個禮拜的『日誌』？", a: "問卷只能測量當下的靜態滿意度。這群客人的狀態是動態變化的（例如從早上的專注轉為下午的疲憊）。「日誌研究 (Diary Studies)」作為民族誌的變體，能讓他們在當下即時記錄真實感受，幫助我們捕捉長時間維度下的脈絡變化，這是單次問卷做不到的。", note: "研究員視角，釐清問卷與日誌研究在脈絡捕捉上的本質差異。"}
  ],
  theory: {
    name: "媒體依賴理論",
    intro: "媒體依賴理論 (Media Dependency Theory) 由 Ball-Rokeach 與 DeFleur 提出。該理論主張，當社會或環境越複雜、變動越劇烈，且個人越需要獲取資訊來達成目標（如理解環境、娛樂放鬆）時，個體對大眾或數位媒體的「依賴程度」就會越高。媒體、社會系統與受眾之間存在著相互影響的共生關係。",
    commentary: "將「媒體依賴理論」置於本章，為「線上虛擬民族誌」提供了強而有力的學理支撐。在「白咖夜酒」這種日夜轉換、資訊複雜的雙棲業態中，顧客無法單憑直覺掌握店內的即時狀態。依據此理論，環境的模糊性會加劇顧客對店家官方 IG 或 LineBot 的資訊依賴。因此，研究團隊運用虛擬民族誌去沉浸並分析顧客的數位足跡，不僅是為了看留言，更是為了剖析這種「依賴關係」如何形塑最終的服務體驗。",
    miniInsight: "媒體依賴理論的隱含意義很有趣：你的官方社群越被顧客當成「不可或缺的資訊來源」，你的責任就越重。一個 IG 公告漏發、一則 LineBot 訊息回得慢，造成的損傷會被「依賴」這個情緒倍數放大。這也是為什麼數位民族誌不只是「看人在說什麼」，而是「看人有多依賴你」。"
  },
  questions: [
    {id: "5-1", section: "桌上研究（純理論）",
     stem: "關於「桌上研究 (Desk Research)」的學理定義與應用，下列哪些正確？",
     options: {A: "因為屬於次級資料的蒐集，所以研究者不需要考慮數據的時效性。", B: "可透過查詢競爭對手的網路評論，快速盤點產業痛點。", C: "其主要目的在於完全替代成本高昂的實地訪談，只要做好桌上研究就不需進入現場。", D: "用於了解宏觀的產業趨勢，為企劃案提供學術或量化數據支持。", E: "它是研究的起點，幫助團隊在進行昂貴的田野調查前，先過濾掉已被證實無效的方向。"},
     correct: ["B","D","E"],
     explain: "盤點競品 (B)、趨勢數據 (D)、過濾無效方向 (E)。A 忽略時效性、C 取代實地訪談皆錯。", deepNote: "桌上研究最容易被低估的價值是「節省團隊的尷尬」——你準備訪談的問題，可能已經有人在 Reddit、Dcard、PTT 上幫你回答過十遍了。先做桌上研究，能避免在訪談時問出「網路上人盡皆知」的低品質問題，浪費難得的對話機會。"},
    {id: "5-2", section: "自我民族誌（純理論）",
     stem: "關於「自我民族誌 (Auto-ethnography)」的具體操作與核心精神，下列敘述哪些正確？",
     options: {A: "研究者假裝自己是陌生顧客，記錄從接觸服務到結束的所有感受，並特別標註令人困惑的環節。", B: "為了維持絕對的客觀，研究者絕對不能記錄自己的主觀感受，只能拍攝照片與計算時間。", C: "找外部工讀生去體驗，研究員自己坐在遠處監控，這樣的操作才符合自我民族誌的學理要求。", D: "記錄自己操作數位系統或實體服務時哪裡不順暢，這種「自我的深度反思」是此方法最珍貴的洞察。", E: "將自己的親身經驗整理成日記並與團隊分享，作為定義顧客潛在痛點的出發點。"},
     correct: ["A","D","E"],
     explain: "親身走流程 (A)、自我深度反思 (D)、整理日記分享 (E)。B 與 C 否定主觀感受的價值，違反方法初衷。", deepNote: "自我民族誌的學術合法性其實長期有爭議——「研究者本身就是研究對象」聽起來像是違反客觀性。但近年的觀點是：完全客觀的觀察本來就是迷思，重要的是把研究者的視角「透明化」，讓讀者能評估那個視角的偏誤。"},
    {id: "5-3", section: "情境應用：打破穀倉的共創（輕情境）",
     stem: "在跨部門協作的情境中，哪種做法最能發揮「共創工作法」打破穀倉效應的作用？",
     options: {A: "將「人物誌」與「旅程圖」印成大海報貼在牆上，讓所有部門（含技術、行銷、前線服務）一起討論並寫下觀察。", B: "由高階主管獨自畫好服務流程圖，然後下達指令要求所有基層員工照著圖面嚴格執行。", C: "讓行銷人員與第一線服務人員共同參與「顧客旅程分析」，協調行銷承諾與現場實際執行的落差。", D: "要求每個人在圖表上只畫出自己部門的專業標準，並嚴格禁止他人對自己的業務給予建議。", E: "透過視覺化工具作為各部門的共同語言，共同釐清「誰在什麼接觸點該處理什麼問題」。"},
     correct: ["A","C","E"],
     explain: "全員共寫海報 (A)、協調落差 (C)、視覺化共同語言 (E)。B 單向命令、D 禁止建議皆違反共創精神。", deepNote: "「把人物誌與旅程圖印成大海報」這個動作看似簡單，背後其實是行為設計：把抽象的數據變成「物理性的、可以一起站在前面討論」的對象，這就是學術裡說的「邊界物件 (boundary object)」——它的價值不在內容本身，而在它讓對話發生的能力。"},
    {id: "5-4", section: "情境應用：研究方法的科學邏輯（輕情境）",
     stem: "在規劃專案的研究階段時，關於「研究方法」的應用邏輯，下列哪些觀念符合服務設計的科學性？",
     options: {A: "研究方法必須嚴格依照順序，如果不先做完桌上研究，就絕對不能開始進行任何觀察或共創。", B: "研究方法的選用應視乎「想回答的問題」而定（例如想了解動機用觀察法，想了解滿意度用量化問卷）。", C: "團隊應無條件優先使用「參與式手法」，因為讓使用者親自參與設計，必定比單純觀察更能激發創意。", D: "蒐集到的研究資料本身並不具備直接價值，唯有轉化成「洞察」並導向「設計解決方案」時才有意義。", E: "為追求數據的統計顯著性，應無視個別使用者的極端或深層需求，只看全體平均值。"},
     correct: ["B","D"],
     explain: "依問題選方法 (B)、資料須轉洞察 (D)。A 強制順序、C 盲目優先參與式、E 只看平均值皆錯。", deepNote: "研究方法的選擇有個鐵律：「方法跟著問題走」。先想清楚「我要回答什麼」，再回頭挑「哪個方法最能回答」。很多人反過來——先選了流行方法（質性訪談、焦點團體），再硬擠問題去配合，這是研究效率最大的浪費源頭。"},
    {id: "5-5", section: "情境應用：跨部門系統圖定義（輕情境）",
     stem: "當團隊運用共創工作法繪製「系統圖／服務藍圖」時，下列哪些接觸點或機制必須是「跨部門」一起定義的？",
     options: {A: "顧客進入門店或使用數位服務時的「等待時間上限」（行銷承諾與現場人員需達成共識）。", B: "數位系統或 APP 發生故障時的「緊急處理機制」（IT 部門與現場服務人員需達成共識）。", C: "內部員工薪資條的計算方式與匯款日期（屬內部財務機密，不需畫進顧客服務系統圖中）。", D: "大型活動開始前的「進場引導與分流流程」（主辦單位與外場安管人員需達成共識）。", E: "顧客在接收 AI 系統推薦後的「結帳與取貨流程」（系統工程師與現場操作人員需達成共識）。"},
     correct: ["A","B","D","E"],
     explain: "等待時間 (A)、故障處理 (B)、進場引導 (D)、結帳流程 (E) 皆為跨部門服務接觸點。C 薪資不屬於顧客服務系統圖範疇。", deepNote: "服務藍圖裡哪些東西必須跨部門共識？一個檢驗標準：只要這個動作會跨越「顧客接觸線」（front stage vs. back stage 之間的那條虛擬線），就需要跨部門共識。不跨越這條線的純內部事務（如薪資、報帳），反而不必畫進去。"},
    {id: "5-6", section: "理論擴充：民族誌與其變體（純理論）",
     stem: "關於服務設計研究中的「民族誌 (Ethnography)」及其變體，下列敘述哪些正確？",
     options: {A: "民族誌的核心精神是研究員必須具備實際的「沉浸式體驗」，而非僅從外部客觀量測數據。", B: "「線上虛擬民族誌」僅需依賴 AI 抓取數據報表即可完成，研究員絕對不應親自潛水閱讀社群論壇的互動。", C: "「購物神秘客」是一種變體，能讓研究員以顧客身分暗訪，客觀檢視既定服務流程的實際執行度。", D: "為了快速獲得洞察，研究團隊應優先使用「秘密員工」法，甚至不需考慮其背後的學術倫理與時間成本。", E: "「日誌研究」要求使用者在一段時間內自行記錄情境行為，有助於研究者捕捉長時間的脈絡變化。"},
     correct: ["A","C","E"],
     explain: "沉浸式體驗 (A)、神秘客暗訪 (C)、日誌捕捉脈絡 (E)。B 否認研究員親自潛水、D 忽略倫理皆違反民族誌精神。", deepNote: "民族誌的各種變體都有共同 DNA：「研究者親自進入情境」。神秘客、秘密員工、日誌研究的差別只在於「研究者扮演的角色」與「沉浸時間長度」。挑變體時問自己：「我要看『客人怎麼看』還是『員工怎麼做』？要看『一瞬間』還是『一段時間』？」答案就出來了。"},
    {id: "5-7", section: "理論擴充：媒體依賴理論（純理論）",
     stem: "依據傳播學中的「媒體依賴理論 (Media Dependency Theory)」，下列觀念哪些正確？",
     options: {A: "當個體處於高度變動或模糊的社會環境中，對媒體資訊的依賴程度會隨之降低。", B: "顧客越需要透過媒體來達成目標（如獲取即時資訊或娛樂），對該媒體的依賴度就越高。", C: "媒體、社會系統與受眾三者之間，存在著相互影響、密不可分的共生關係。", D: "理論認為，所有的媒體訊息都會像魔彈一樣，對所有受眾產生完全一致的直接影響。", E: "在複雜的商業服務中，企業所建構的數位媒體（如官方社群）能成為減輕顧客不確定感的重要依賴節點。"},
     correct: ["B","C","E"],
     explain: "需求高則依賴高 (B)、三方共生關係 (C)、數位媒體減輕不確定感 (E)。A 顛倒依賴方向、D 魔彈論早已被推翻皆錯。", deepNote: "媒體依賴理論寫於 1976 年，當時針對的是電視；但放到 LineBot、IG 時代反而更貼切——因為我們對數位媒體的依賴遠超過當年的電視。理論的核心預言（環境越亂、依賴越深）在演算法時代得到了更精準的驗證。"},
    {id: "5-8", section: "理論與情境結合：白咖夜酒的虛擬民族誌（輕情境）",
     stem: "白咖夜酒團隊決定運用「線上虛擬民族誌」來研究 IG 粉絲團上的顧客行為。結合媒體依賴理論，下列分析哪些正確？",
     options: {A: "由於日夜班切換的服務形態較為複雜，這種模糊性會加劇顧客對 IG 即時動態的資訊依賴。", B: "研究員除了統計按讚數，更應「沉浸」在留言區中，剖析顧客在社群文化中的真實情緒與互動腳本。", C: "依據媒體依賴理論，若 IG 無法即時提供今晚的脫口秀卡司資訊，將不會對顧客的最終體驗產生任何負面影響。", D: "團隊可透過這項研究，觀察高度依賴社群資訊的顧客，如何透過留言與店家進行價值的「共創」。", E: "為了追求效率，這項研究應完全交由外部公關公司負責，內部服務人員無需了解虛擬社群中的顧客聲音。"},
     correct: ["A","B","D"],
     explain: "模糊加劇依賴 (A)、沉浸於留言區 (B)、共創觀察 (D)。C 否認依賴影響、E 將研究外包剝離內部洞察皆錯。", deepNote: "線上虛擬民族誌的隱藏門檻是「研究者必須懂該社群的次文化」。如果研究者不熟悉 IG 的話術語境（限動、發文時段、tag 文化），看到的數據會像看天書——所以這類研究通常無法外包，必須由本身就泡在那個圈子裡的人來做。"}

    {h: "原型測試的流程與本質", b: "原型的核心精神是「用最低成本、最快速度」驗證假設。測試前必須明確定義「目的與問題」（如同界定研究範圍）。最重要的收尾是「追蹤循環與選擇」，藉此客觀決定點子的保留、修改或捨棄。擬真度 (Fidelity) 的高低，取決於能否回答當下的測試問題。"},
    {h: "調查性排練與潛台詞", b: "強調團隊親自扮演不同角色，感受服務體驗中的情緒流動。此舉能精準捕捉顧客未說出口的「潛台詞 (Subtext)」（如不耐煩的皺眉、來回踱步等非語言行為），找出真實的服務缺口。"},
    {h: "原型工具的定義與應用", b: "綠野仙蹤法 (Wizard of Oz)：人工幕後模擬，極適合驗證對話邏輯；紙上排練／互動式點擊模型：無程式碼狀態下感受操作動線；最小令人喜愛產品 (MLP)：原型不只能運作，更要在情感上產生共鳴。漢莎航空等案例證明能降低重工成本。"}
  ],
  aiInsight: "原型（Prototype）從來都不是產品的「半成品」，而是一個「用來發問的工具」。你製作原型的精緻度（擬真度），只需要剛好足夠回答你當下想驗證的那個問題就好，多做都是一種資源浪費。",
  scenarios: [
    {role: "斤斤計較的白咖夜酒財務合夥人", q: "我們只需要一個能讓客人順利掃碼點餐的系統就好，為什麼設計團隊堅持要測試什麼『最小令人喜愛產品 (MLP)』？這不是浪費預算嗎？", a: "系統「能用」只是底線，但 MLP 強調的是「情感共鳴」。在晚上脫口秀這種需要放鬆的環境，如果點餐系統的介面設計與引導語能讓客人覺得幽默、有溫度（令人喜愛），就能大幅降低他們在昏暗燈光下操作的焦慮。長期來看，這是為我們省下處理客訴的巨大隱形成本。", note: "成本控管視角，帶出 MLP 在情感共鳴與隱形成本的價值。"},
    {role: "滿臉困惑的夜班服務生", q: "我們明明寫了完美的『脫口秀中場休息點酒引導腳本』，但實地演練時客人還是看起來很困惑，問他們哪裡不懂又說不上來，該怎麼辦？", a: "這時候就需要進行「調查性排練」。不要只看文字腳本，讓團隊親自下去扮演觀眾與酒保。透過肢體與空間的實際互動，就能親身捕捉到那些未說出口的「潛台詞 (Subtext)」——例如觀眾是因為找不到結帳按鈕而皺眉，這才是腳本上看不見的真正缺口。", note: "前線盲點視角，凸顯調查性排練捕捉潛台詞的效用。"},
    {role: "務實冷靜的吧台店長", q: "我想測試新的 LINE Bot 推薦調酒邏輯順不順，是不是該請外包工程師先花兩個禮拜，把資料庫跟後台寫出來再測？", a: "千萬不要！為了測試單純的「對話邏輯」，我們應該用最低成本的方法。您只需要用「綠野仙蹤法」：讓一位員工躲在後台，用一般的 LINE 假裝機器人手動回覆測試者。只要能驗證邏輯是否符合直覺，就不該提早投入昂貴的程式開發資源。", note: "務實店長視角，示範工具必須對齊低成本驗證目的。"}
  ],
  theory: {
    name: "科技接受模式 (TAM)",
    intro: "科技接受模式 (Technology Acceptance Model, TAM) 由 Fred Davis (1989) 提出。該理論主張，使用者是否願意接受並使用一項新科技系統，主要取決於兩大核心信念變數：認知有用性 (Perceived Usefulness, PU)，即使用者主觀認為該系統能提升其績效；認知易用性 (Perceived Ease of Use, PEOU)，即使用者主觀認為操作該系統不需付出過多心力。PEOU 會正向影響 PU，而兩者共同決定使用者的「行為意圖 (Behavioral Intention)」。",
    commentary: "原型測試的本質，其實就是在產品正式開發前，以最低成本量測使用者的 PU 與 PEOU。例如：用「紙上排練」測試按鈕佈局，本質上是在驗證「認知易用性 (PEOU)」；而用「綠野仙蹤法」測試推薦邏輯，則是在驗證系統是否真能幫顧客快速選酒，也就是「認知有用性 (PU)」。TAM 為服務設計的原型測試，提供了堅實且可量化的評估框架。",
    miniInsight: "TAM 在這章最關鍵的一句是「PEOU 正向影響 PU」——白話來說，就是「難用的東西，使用者連它有沒有用都不想知道」。所以你的原型測試順序應該是：先驗證易用性（紙上排練），才驗證有用性（綠野仙蹤）。把這順序顛倒過來，你會在錯誤的問題上浪費資源。"
  },
  questions: [
    {id: "7-1", section: "原型測試流程（純理論）",
     stem: "關於原型測試的標準流程，下列哪些符合理論定義？",
     options: {A: "決定「擬真度 (Fidelity)」時，應優先考慮如何用最低成本快速回答測試問題，而非追求外觀完美。", B: "「受眾」的選擇僅需包含最終端使用者即可，內部服務人員的測試是不必要的。", C: "「追蹤循環與選擇」階段，核心目的在客觀評估不同原型成效，以決定何者應被保留、修改或捨棄。", D: "測試前必須明確定義「目的與問題」，這與學術研究中界定研究範圍與假設高度相似。", E: "服務設計的原型測試通常是一次性的線性過程，測試通過後即代表服務已可正式發布。"},
     correct: ["A","C","D"],
     explain: "低成本驗證 (A)、追蹤循環選擇 (C)、明確定義目的問題 (D)。B 忽略內部人員、E 一次性線性皆錯。", deepNote: "「擬真度跟著測試問題走」是原型階段最容易違背的鐵律。團隊通常會把擬真度當「越高越好」，因此投入過多時間做漂亮版本——結果一切問題都還沒問，資源已經燒完。記住：低擬真度不是「品質差」，是「精準對齊問題」。"},
    {id: "7-2", section: "調查性排練（純理論）",
     stem: "關於「調查性排練 (Investigative Rehearsal)」與相關概念，哪些正確？",
     options: {A: "強調整個團隊親自扮演不同角色，去感受服務體驗中的情緒流動與肢體語言。", B: "「潛台詞 (Subtext)」指那些未說出口、但透過非語言行為（不耐煩動作）表達的真實感受，常是找出服務缺口的關鍵。", C: "桌上演練 (Desktop Walkthrough) 是指在真實場域進行 1:1 比例的實體模擬，以測試空間動線。", D: "透過排練，設計團隊可將抽象的服務概念轉化為可體驗的具體情境。", E: "為維持客觀性，排練過程中應嚴格禁止參與者表達個人的主觀情緒。"},
     correct: ["A","B","D"],
     explain: "親自扮演感受 (A)、潛台詞 (B)、抽象轉具體 (D)。C 把桌上演練誤為 1:1 實體模擬、E 禁止情緒違反排練精神。", deepNote: "「潛台詞 (Subtext)」這個詞借自戲劇理論——演員學到的第一課就是「台詞下面的真實情緒」。把這個觀念搬到服務設計，意思是：顧客嘴上說的（「還可以」）和身體說的（皺眉、踱步、滑手機）常常是兩回事。會看 Subtext 的設計師才能挖到真痛點。"},
    {id: "7-3", section: "原型工具定義（純理論）",
     stem: "關於書中多種原型測試工具，下列定義哪些正確？",
     options: {A: "「綠野仙蹤法」是在使用者不知情下，由人在幕後手動模擬系統回應，藉以測試系統概念可行性。", B: "「最便宜的紙板原型」因擬真度太低，在嚴謹流程中通常被認為是無效的工具。", C: "「人扮演 App 的數位服務排練」可讓非技術人員在寫任何程式碼之前，先測試介面互動邏輯。", D: "商業模式圖與情緒板屬於概念發想的產物，完全不能被當作原型測試的一部分。", E: "「互動式點擊模型」通常用於數位介面測試，讓使用者透過點擊靜態圖片感受操作動線。"},
     correct: ["A","C","E"],
     explain: "綠野仙蹤 (A)、紙上排練測互動 (C)、互動式點擊模型 (E)。B 貶低紙板原型、D 完全否定商模圖／情緒板皆錯。", deepNote: "綠野仙蹤法的命名來自《綠野仙蹤》電影裡那個躲在簾幕後操控大機器的小老頭——這個典故很貼切：使用者以為自己在跟強大的系統互動，其實後面是一個人在手動回覆。這個方法之所以強大，正在於它讓你不用真的造出大機器，就能驗證「使用者願不願意跟這台大機器互動」。"},
    {id: "7-4", section: "低成本驗證對話邏輯（輕情境）",
     stem: "哪種原型測試方式能最有效低成本驗證「自動化對話機器人的點餐邏輯」？",
     options: {A: "在紙上畫出幾個關鍵回覆畫面，讓團隊用手指點擊紙張測試對話動線是否順暢。", B: "運用「綠野仙蹤法」，不寫程式由研究員在後台親自用通訊軟體回覆，觀察客人是否對語氣或流程困惑。", C: "要求工程師開發出含資料庫的完整系統後，再邀請專業測試員進行系統除錯。", D: "運用「調查性排練」，請客人假裝正在看表演，並對著空氣說出想點的飲料。", E: "將不同飲料照片貼在「情緒板」上，觀察客人最喜歡哪一種顏色。"},
     correct: ["A","B"],
     explain: "紙上介面 (A) 與綠野仙蹤 (B) 能精準低成本驗證對話邏輯。C 投入過高開發成本、D 測實體動線、E 測品牌氛圍皆不對齊測試目的。", deepNote: "「工具對齊測試目的」這個觀念，等同於統計學裡的「測量效度 (Construct Validity)」——你的測量工具測到的，到底是不是你想測的東西？用情緒板測「對話邏輯」、用調查性排練測「介面流暢度」，都是測量效度低的錯誤。"},
    {id: "7-5", section: "企業案例（綜合考核）",
     stem: "下列哪些敘述正確傳達了原型測試在商業實務上的影響力？",
     options: {A: "Fjord 提出的「最小令人喜愛產品 (MLP)」，主張原型不僅要能運作，還要在情感上與使用者產生共鳴。", B: "改善乳癌病人等候時間的案例顯示，原型測試重點只能放在實體醫療器材上，無法應用於無形的醫病溝通流程。", C: "漢莎航空 (Lufthansa) 的大規模 1:1 角色扮演模擬，證明實體空間的原型測試能有效降低未來營運的高昂重工成本。", D: "Airbus 的案例表明，設計思考與原型測試僅適用於服務業，無法在製造業中產生創新價值。", E: "這些案例共同印證：在投入龐大資金與時間前，進行快速、低成本的原型測試，是管控商業風險的最佳策略。"},
     correct: ["A","C","E"],
     explain: "MLP 情感共鳴 (A)、漢莎降重工成本 (C)、低成本控風險 (E)。B 限縮乳癌案例範圍、D 限縮 Airbus 於服務業皆錯。", deepNote: "MLP（最小令人喜愛產品）跟 MVP（最小可行產品）的差別，是一個情感維度的升級。MVP 只要「能用」，MLP 要「能用 + 想用」。在競爭激烈的市場，光是能用早就不夠了——這也是為什麼近年 Fjord 等顧問公司把 MLP 推為新標準。"},
    {id: "7-6", section: "理論擴充：科技接受模式 TAM（純理論）",
     stem: "關於「科技接受模式 (TAM)」的核心定義，下列敘述哪些正確？",
     options: {A: "該理論主張，使用者是否接受一項新科技，主要取決於兩大信念：「認知有用性 (PU)」與「認知易用性 (PEOU)」。", B: "「認知有用性 (PU)」是指使用者主觀認為該系統能夠解決其實際問題或提升效率的程度。", C: "只要企業投入極高的預算開發系統，使用者就絕對會產生極高的「認知易用性」，無需進行前期測試。", D: "「認知易用性 (PEOU)」是指使用者主觀認為操作該系統時，不需耗費過多心力與學習成本。", E: "TAM 理論認為，系統的美觀度是決定使用者行為意圖的唯一且絕對因素，與系統是否實用無關。"},
     correct: ["A","B","D"],
     explain: "PU 與 PEOU 兩信念 (A)、PU 為解決問題 (B)、PEOU 為操作不費力 (D)。C 把預算等同於易用、E 把美觀視為唯一因素皆錯。", deepNote: "TAM 模型在 1989 年提出後，後續還衍生了 TAM2、TAM3、UTAUT 等延伸版本，加入社會影響、自我效能等變數。但所有版本的核心都沒變：PU 與 PEOU 是接受新科技的兩大支柱。這個模型的長壽，證明它抓到了人類接受新科技的本質。"},
    {id: "7-7", section: "理論擴充：TAM 變數與原型測試（純理論）",
     stem: "將 TAM 的核心變數應用於服務設計的「原型測試」時，下列觀點哪些符合科學驗證邏輯？",
     options: {A: "原型測試的核心價值之一，在於以最低成本及早測量使用者的「認知易用性 (PEOU)」，避免開發出難以操作的廢品。", B: "進行紙上介面排練時，團隊應專注於測試系統後台的資料庫算力，而非使用者的認知易用性。", C: "運用「綠野仙蹤法」手動模擬對話邏輯，能有效驗證該對話服務是否具備解決痛點的「認知有用性 (PU)」。", D: "若原型測試顯示系統極度難用（PEOU 低落），團隊應忽視此數據，堅持上線後再讓使用者慢慢習慣。", E: "依據 TAM，認知易用性會正向影響認知有用性；若介面極難操作，使用者往往也會認為該系統毫無用處。"},
     correct: ["A","C","E"],
     explain: "原型測 PEOU (A)、綠野仙蹤測 PU (C)、PEOU 正向影響 PU (E)。B 紙上排練測算力錯位、D 忽視難用數據皆錯。", deepNote: "「PEOU 正向影響 PU」這條因果鏈在實務上有個強大的推論：當你發現使用者覺得系統「沒用」時，先檢查是不是「太難用」造成的——很多時候不是功能不夠，而是介面太爛讓使用者根本沒體驗到功能的價值。"},
    {id: "7-8", section: "理論與情境結合：白咖夜酒的數位酒單測試（輕情境）",
     stem: "白咖夜酒團隊準備導入全新的「桌邊掃碼 AI 推薦酒單系統」。在撰寫程式碼前，團隊決定先運用原型與 TAM 理論進行驗證，下列作法哪些正確？",
     options: {A: "為了測試「認知易用性 (PEOU)」，團隊用幾張厚紙板畫出介面，讓顧客在微醺狀態下試著用手指點擊，觀察是否會按錯。", B: "為了測試「認知有用性 (PU)」，團隊不寫程式，由店長親自在後台用一般通訊軟體回覆推薦，觀察顧客是否真的覺得這能幫助他們選酒。", C: "根據 TAM 理論，只要掃碼系統的外觀設計夠炫酷，即使點餐邏輯混亂，顧客也會覺得它極度「有用」。", D: "原型測試若發現顧客對 AI 的推薦語氣感到抗拒，團隊應果斷進入「追蹤循環與選擇」階段，修改腳本並重新測試，以優化行為意圖。", E: "店長認為只要強制撤除所有實體酒單，顧客就一定會接受新科技，因此完全不需要在前期測試他們的認知易用性。"},
     correct: ["A","B","D"],
     explain: "紙板測 PEOU (A)、綠野仙蹤測 PU (B)、循環迭代 (D)。C 把外觀等同有用、E 強制接受新科技皆錯。", deepNote: "把 TAM 套到原型測試，順序是關鍵：先測 PEOU（紙上排練），再測 PU（綠野仙蹤）。順序倒過來會有什麼問題？你會在「使用者根本沒辦法操作系統」的狀態下，去問他「這系統有沒有用」——數據會被嚴重污染。"}
  ]
},
{
  cno: "8", chapter: "第八章", title: "落實（實踐與變革管理）",
  knowledgePoints: [
    {h: "本質是變革管理 (Change Management)", b: "服務設計的落實，不僅是設計對外的顧客體驗，更是重新設計組織內部的運作方式。導入新服務往往意味著打破舊有的權力結構與穀倉效應，這必然會引發陣痛。"},
    {h: "員工體驗即顧客體驗", b: "前線員工是服務交付的最終樞紐。若內部系統難用、員工不具備參與感或感受到威脅，再好的前端設計也會在「落實階段」徹底失敗。"},
    {h: "持續迭代與生命週期", b: "系統上線（Launch）絕對不是專案的終點，而是「下一個優化循環」的起點。真實的營運場域充滿變數，必須建立持續捕捉現場反饋的機制，使服務系統具備適應力。"}
  ],
  aiInsight: "在組織導入階段，「文化吃掉策略 (Culture eats strategy for breakfast)」是鐵律。服務設計師有一半的工作時間，其實是在做內部溝通、化解抗拒，並賦能 (Empower) 第一線員工。",
  scenarios: [
    {role: "焦慮抗拒的夜班資深酒保", q: "為什麼總部硬要塞這個新的點餐系統給我們？我用手寫單記了五年都沒出錯，現在尖峰時段還要看螢幕，完全拖慢我的節奏！", a: "這是落實階段忽略「員工體驗」的典型後果。如果新系統的操作介面沒有讓您的工作變得更絲滑，反而增加了視覺與操作的負擔，您自然會抗拒。沒有員工的認同，這套系統在現場就無法存活，這正是變革管理失敗的警訊。", note: "資深員工視角，呈現內部體驗與變革管理的學理重要性。"},
    {role: "充滿熱忱的白咖夜酒 IT 工程師", q: "我為了確保店裡的客服機器人絕對保密且反應極快，特別把系統架設在本地端的伺服器上跑模型，這樣客人的數位體驗應該完美了吧？", a: "你的硬體配置確實非常強大！但在落實階段，技術效能只是服務生態系統中的其中一個微觀節點。如果外場服務生不知道如何引導客人掃碼，或者日班店長不願意配合更新菜單資料，那本地端模型跑得再快，顧客也無法感受到這份價值。", note: "技術視角，點出工具不能凌駕於結果的盲點。"},
    {role: "冷靜宏觀的商場管委會代表", q: "你們白咖夜酒的脫口秀雖然很受歡迎，但散場時的人潮與噪音已經影響到商場其他店家的營運了，你們的服務流程有考慮到這個層面嗎？", a: "這正是服務設計在落實階段必須面對的「生態系」考驗。我們的服務不能只看店內（微觀），必須考慮到整個商場社群（中觀）。如果散場動線破壞了周邊利害關係人的利益，長久下來將威脅到我們的生存空間，必須將這股外部壓力納入持續迭代的修正範圍。", note: "外部利害關係人視角，鋪陳服務生態系統的宏觀視野。"}
  ],
  theory: {
    name: "服務生態系統模型",
    intro: "服務生態系統模型 (Service Ecosystem Model) 基於服務主導邏輯 (S-D Logic) 延伸而來。該模型認為價值共創不是發生在真空裡，而是存在於一個由社會制度、科技與行動者交織而成的動態網絡中。系統分為三個層次：微觀層次 (Micro)：個別行動者之間的直接互動；中觀層次 (Meso)：組織內部或特定社群網絡的互動；宏觀層次 (Macro)：廣泛的社會文化、法規政策與經濟結構。",
    commentary: "將「服務生態系統模型」置於落實階段，能為團隊提供極具深度的「系統思考 (Systems Thinking)」視角。許多服務在原型階段測試完美，卻在「落實」時慘遭滑鐵盧，就是因為設計者只看見了「微觀」的互動，卻忽略了「中觀」的組織穀倉效應，或是抵觸了「宏觀」的文化法規。",
    miniInsight: "微觀、中觀、宏觀的三層思考，最容易出錯的不是「看不到宏觀」，而是「過度執著微觀」。設計師很容易把全部心力放在「掃碼介面要不要圓角」這種微觀細節，卻沒注意到中觀的部門 KPI 衝突已經讓這套系統根本無法落地——這也是為什麼變革管理才是落實階段的真正戰場。"
  },
  questions: [
    {id: "8-1", section: "落實階段的本質（純理論）",
     stem: "關於服務設計的「落實 (Implementation)」階段，下列學理敘述哪些正確？",
     options: {A: "落實的本質是一種「變革管理 (Change Management)」，因為它無可避免地會挑戰組織既有的部門邊界與作業習慣。", B: "只要前期的服務藍圖畫得夠精美，組織落實就必定會自動成功，與企業內部文化無關。", C: "落實階段的核心挑戰之一，是克服前線員工對新流程或新科技的抗拒心理。", D: "為了確保效率，落實階段應由高階主管直接下達死命令，嚴禁前線員工對新流程提出質疑。", E: "設計團隊在落實階段的任務，包含溝通、化解內部摩擦，並賦能 (Empower) 第一線服務人員。"},
     correct: ["A","C","E"],
     explain: "變革管理 (A)、克服員工抗拒 (C)、賦能前線 (E)。B 忽視文化、D 高壓死命令皆是落實失敗的常見盲點。", deepNote: "Peter Drucker 的名言「Culture eats strategy for breakfast」（文化吃掉策略當早餐）放在落實階段最貼切。再完美的服務藍圖，遇到一個拒絕改變的組織文化，都會被吞噬。所以服務設計師的另一半工作，其實是文化變革管理。"},
    {id: "8-2", section: "員工體驗與持續迭代（純理論）",
     stem: "關於系統「正式上線 (Launch)」與「員工體驗」的觀念，下列哪些正確？",
     options: {A: "系統上線代表專案的最終句點，設計團隊可以完全撤出，不再進行任何修改。", B: "前線員工的「內部體驗」與最終交付的「顧客體驗」具有高度連動性，兩者密不可分。", C: "上線應被視為下一個優化循環的起點，因為真實營運環境必定會產生測試階段未預見的新極端情境。", D: "服務組織必須建立一套持續捕捉顧客與前線員工回饋的機制，確保服務具備動態適應能力。", E: "為了維持品牌的一致性，即使上線後發現嚴重瑕疵，也絕不允許對核心流程進行更動。"},
     correct: ["B","C","D"],
     explain: "內外體驗連動 (B)、上線為新循環起點 (C)、建立回饋機制 (D)。A 撤出停修、E 拒絕更動皆違反服務的動態演化精神。", deepNote: "「員工體驗 = 顧客體驗」這條公式的因果鏈很直接：員工被糟糕的內部系統折磨 → 對工作失去熱情 → 對顧客的態度變冷 → 顧客感受到敷衍。所有對外的優化，最終都要回頭優化對內的體驗——這是很多企業忽略的隱藏戰場。"},
    {id: "8-3", section: "情境應用：前線保全的抗拒（輕情境）",
     stem: "商場全面導入數位車牌辨識系統後，晚班保全卻消極抵制，導致車道塞車。從服務設計落實的視角分析，哪些解方正確？",
     options: {A: "認知到保全的抗拒可能源自系統增加了他們處理異常車輛的操作負擔，團隊應重新檢視「後台員工體驗」。", B: "發布嚴格的懲處公告，只要保全不用數位系統就扣薪水，用恐懼感來加速組織變革。", C: "邀請保全代表參與系統上線後的「檢討會議」，讓他們從「被動執行者」轉變為優化流程的「共創者」。", D: "承認系統導入是一場變革管理，需要給予前線人員足夠的教育訓練與適應心理建設。", E: "直接將抗拒的保全解雇，換一批懂科技的年輕保全，這是解決落實問題最快的方法。"},
     correct: ["A","C","D"],
     explain: "檢視員工體驗 (A)、邀請共創 (C)、變革管理與教育 (D)。B 高壓懲處、E 直接解雇皆是粗暴且破壞信任的錯誤手段。", deepNote: "前線員工抗拒新系統最常見的真正原因不是「不懂科技」，而是「沒被尊重」。一套從天而降、沒人問過他們意見的系統，會被視為對專業的否定。解方不是訓練，是「邀請共創」——讓他們從早期就參與設計，他們會成為系統最大的守護者。"},
    {id: "8-4", section: "成功落實的跨部門協作（綜合考核）",
     stem: "若要確保一項跨部門的新服務成功落地營運，團隊應掌握哪些核心原則？",
     options: {A: "在推行時，不僅要宣導「怎麼做 (How)」，更要向所有利害關係人溝通「為什麼要做 (Why)」，建立文化認同。", B: "服務的落實不僅是 IT 部門架設系統的工作，更是行銷宣導、現場動線、前線人員訓練的跨部門大會師。", C: "將前期原型測試取得的數據結果，作為說服不同利害關係人（如財務部、營運部）的重要決策證據。", D: "落實初期應追求 100% 的完美無缺，寧可延遲兩年上線，也不允許初期有任何微小的操作摩擦。", E: "只要給予前線人員足夠的獎金，就完全不需要考慮新系統介面是否符合他們的人體工學與認知習慣。"},
     correct: ["A","B","C"],
     explain: "溝通 Why (A)、跨部門協作 (B)、原型為證據 (C)。D 追求完美延遲、E 認為金錢可掩蓋糟糕設計皆錯。", deepNote: "「為什麼要做（Why）」比「怎麼做（How）」更重要——這是 Simon Sinek 的 Golden Circle 理論。組織變革的失敗，多半不是員工不會做，而是不知道為什麼要做。一旦理解了 Why，How 的學習速度會快十倍。"},
    {id: "8-5", section: "理論擴充：服務生態系統模型（純理論）",
     stem: "關於「服務生態系統模型 (Service Ecosystem Model)」的核心學理，下列敘述哪些正確？",
     options: {A: "該模型主張價值共創發生在一個由科技、社會制度與多方行動者交織而成的動態網絡中。", B: "「微觀層次 (Micro)」專注於探討個別行動者或單一接觸點之間的直接互動。", C: "「宏觀層次 (Macro)」涉及了社會文化、法律規範與整體產業結構對服務系統的深遠影響。", D: "該模型認為只要企業內部（中觀）管理良好，就完全不需要理會外部法規與社會文化（宏觀）的變化。", E: "服務生態系統是靜態封閉的，一旦建立完成，系統內的資源與制度就不會再發生流動與演化。"},
     correct: ["A","B","C"],
     explain: "動態網絡 (A)、微觀為單一接觸 (B)、宏觀為文化法規 (C)。D 忽視宏觀、E 視為靜態封閉皆違反生態系統的動態性。", deepNote: "服務生態系統模型的三個層次（微觀／中觀／宏觀）借鑒自系統理論的「層級分析」。它的最大價值不是分類，而是提醒設計師：你看到的問題往往不在你看到的那一層。微觀的客訴可能源自中觀的權責不清，中觀的衝突可能源自宏觀的法規空白。"},
    {id: "8-6", section: "理論擴充：生態系統的制度安排（純理論）",
     stem: "在服務生態系統中，關於「制度安排 (Institutional arrangements)」的影響力，哪些敘述正確？",
     options: {A: "制度安排包含了明文的法律規範，以及不成文的社會習俗與組織文化。", B: "生態系統中不同層次（微觀、中觀、宏觀）的制度必須互相對齊，服務才能順利落實與存活。", C: "若企業推行的新服務（微觀創新）嚴重牴觸了社會現有的道德價值觀（宏觀制度），該服務將難以擴展。", D: "服務設計者的任務僅限於改變微觀的介面設計，無權也不應試圖去影響中觀或宏觀的制度。", E: "制度安排是阻礙創新的唯一原因，因此服務設計的終極目標是徹底消滅所有生態系內的規則。"},
     correct: ["A","B","C"],
     explain: "明文與不成文制度 (A)、層次需對齊 (B)、牴觸宏觀難擴展 (C)。D 限縮設計者職權、E 視制度為阻礙皆過於極端。", deepNote: "「制度安排」這個詞翻譯自 institutional arrangements，包含「明文規則」與「不成文習慣」。後者往往更頑強——白咖夜酒裡「夜班不接日班的客訴」可能不是寫在 SOP 裡，但全員都默默遵守。改變不成文制度，比修改 SOP 困難十倍。"},
    {id: "8-7", section: "理論與情境結合：白咖夜酒的生態系分析（輕情境）",
     stem: "白咖夜酒準備擴大營業規模。若運用「服務生態系統模型」進行分析，下列對應與決策哪些正確？",
     options: {A: "顧客使用 LINE Bot 點餐，以及酒保親自遞上調酒的過程，屬於生態系中的「微觀層次」互動。", B: "日班與夜班團隊之間建立的資源共享機制與交接文化，屬於生態系中的「中觀層次」。", C: "政府若推動「夜間經濟振興法案」，這屬於「宏觀層次」的變動，將直接影響店家的生存與價值共創環境。", D: "只要微觀層次的調酒夠好喝，就絕對能無視中觀層次（如商場管委會的抗議）與宏觀層次（如噪音法規）的制約。", E: "團隊應意識到，導入新的數位系統不僅是硬體升級，更會連動改變整個生態系內的資源交換模式。"},
     correct: ["A","B","C","E"],
     explain: "點餐互動為微觀 (A)、日夜交接為中觀 (B)、振興法案為宏觀 (C)、系統連動生態 (E)。D 忽視中宏觀制約，違反系統思考。", deepNote: "生態系統思考最反直覺的一課：你的服務不是在跟「直接競爭對手」競爭，而是在跟「整個生態系」共存共榮。白咖夜酒打贏隔壁咖啡店沒意義，要看的是整條街的人流與商業生態能不能維持——這是現代商業地理學的核心觀念。"},
    {id: "8-8", section: "理論與情境結合：落實階段的系統衝突（輕情境）",
     stem: "白咖夜酒在落實「深夜單口喜劇戶外派對」專案時遭遇嚴重阻力。結合服務生態系統模型，下列分析哪些正確？",
     options: {A: "若專案遭到周邊社區居民集體抗議，這代表微觀的服務創新與中觀／宏觀的社區制度（安寧需求）產生了嚴重衝突。", B: "為了成功落實，團隊必須跨出單一店面，與社區代表（中觀行動者）進行對話與價值共識的重塑。", C: "落實失敗純粹是因為前線員工執行力不足，與外部的生態環境變數毫無關聯。", D: "服務設計的落實，本質上就是在這個複雜的生態網絡中，尋找並協調各方利害關係人都能接受的「制度平衡點」。", E: "依據該模型，企業應直接動用財務資源壓制所有外部抗議，這是維持生態系穩定的唯一方法。"},
     correct: ["A","B","D"],
     explain: "微觀與中宏觀衝突 (A)、跨出店面對話 (B)、尋找制度平衡點 (D)。C 純歸咎前線、E 用財務壓制皆違反生態系協調精神。", deepNote: "「制度平衡點」是落實階段的終極目標——找到一個讓微觀使用者、中觀組織、宏觀社會都能接受的平衡。完全偏向其中一邊都會失敗：太偏微觀（只討好顧客）會違反法規；太偏宏觀（只遵守法規）會失去顧客；太偏中觀（只方便組織）會失去信任。"}
  ]
},
{
  cno: "9", chapter: "第九章", title: "服務主導邏輯與價值共創（總結核心）",
  knowledgePoints: [
    {h: "服務主導邏輯 (S-D Logic)", b: "現代經濟的基石。打破傳統的「商品主導邏輯（認為企業賣斷實體產品即完成價值交換）」，主張所有經濟活動的本質都是「服務的交換」，實體商品只是傳遞服務的載體。"},
    {h: "價值主張 (Value Proposition)", b: "企業（或管委會、組織）無法單方面「製造並給予」價值給顧客，只能提供一個環境、工具或提出一個「價值主張」。"},

}

.scenario{
  background:var(--card); border:1px solid var(--line); border-radius:3px;
  margin-bottom:10px; box-shadow:var(--shadow);
  transition:.15s;
}
.scenario[open]{border-color:var(--accent);}
.scenario summary{
  list-style:none; cursor:pointer; padding:12px 14px;
  display:flex; flex-direction:column; gap:6px;
  position:relative;
}
.scenario summary::-webkit-details-marker{display:none;}
.scenario .role{
  font-size:11px; color:var(--accent-deep); letter-spacing:.03em;
  font-weight:700;
  background:var(--card-soft); padding:3px 8px; border-radius:2px;
  display:inline-block; align-self:flex-start;
}
.scenario .q{
  font-family:"Noto Serif TC",serif; font-size:13.5px;
  line-height:1.55; color:var(--ink); font-weight:500;
}
.scenario .q::before{content:"Q　"; color:var(--accent); font-weight:900; font-family:"Fraunces",serif; font-style:italic;}
.scenario .toggle-hint{
  font-size:10.5px; color:var(--muted);
  margin-top:2px;
}
.scenario[open] .toggle-hint{display:none;}
.scenario .body-wrap{
  padding:2px 14px 14px;
  border-top:1px dashed var(--line);
}
.scenario .a{
  font-size:13px; line-height:1.7; color:#2d2622;
  margin-top:10px;
}
.scenario .a::before{content:"A　"; color:var(--right); font-weight:900; font-family:"Fraunces",serif; font-style:italic;}
.scenario .ai-note{
  margin-top:10px; font-size:11.5px; color:var(--accent-deep);
  background:rgba(138,42,28,.07); padding:7px 11px;
  border-left:3px solid var(--accent); border-radius:0 2px 2px 0;
  font-style:italic; line-height:1.5;
}

/* === Theory block (new) === */
.theory-block{
  margin-top:22px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:3px;
  padding:14px 16px 16px;
  box-shadow:var(--shadow);
  position:relative;
}
.theory-block::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:3px;
  background:linear-gradient(180deg, var(--plum), var(--accent));
}
.theory-name{
  font-family:"Noto Serif TC",serif;
  font-weight:700; font-size:14.5px;
  color:var(--plum); margin-bottom:8px;
  display:flex; align-items:baseline; gap:6px;
}
.theory-name .icon{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  color:var(--accent); font-size:18px;
}
.theory-section{
  margin-bottom:11px;
}
.theory-section:last-child{margin-bottom:0;}
.theory-section .sec-label{
  font-size:10px; letter-spacing:.16em; font-weight:700;
  color:var(--muted); margin-bottom:4px;
  display:block;
}
.theory-section .sec-body{
  font-size:12.5px; line-height:1.65;
  color:#2d2622;
}
.theory-section.commentary .sec-label{color:var(--accent);}
.theory-section.commentary .sec-body{
  font-style:italic;
  color:#3a2f29;
}

/* MINI INSIGHT — observation extension box */
.mini-insight{
  margin-top:14px;
  background:linear-gradient(135deg, rgba(90,60,95,.12), rgba(168,122,45,.05));
  border:1px solid rgba(90,60,95,.25);
  border-radius:2px;
  padding:11px 13px 13px;
  position:relative;
}
.mini-insight::before{
  content:"✦";
  position:absolute;
  top:9px; right:11px;
  font-size:14px; color:var(--plum); opacity:.6;
}
.mini-insight .mi-label{
  font-size:9.5px; letter-spacing:.22em; font-weight:700;
  color:var(--plum); margin-bottom:5px;
  display:block;
}
.mini-insight .mi-body{
  font-family:"Noto Serif TC",serif;
  font-size:12.5px; line-height:1.65;
  color:#3a2f3d;
  font-weight:500;
}

/* === Q/A GRID (middle + right columns) === */
.qa-grid{
  grid-column: 2 / span 2;
  display:grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  gap:14px;
}
.qa-grid-header{
  grid-column: 1 / -1;
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:14px;
  margin-bottom:-4px;
}
.qa-grid-header .hdr{
  font-family:"Noto Sans TC"; font-size:11px; font-weight:700;
  letter-spacing:.18em; color:var(--muted);
  padding:0 6px 6px; border-bottom:1px solid var(--line);
}

/* Quiz cards */
.quiz-card{
  background:var(--card); border:1px solid var(--line);
  border-radius:4px; box-shadow:var(--shadow); overflow:hidden;
  display:flex; flex-direction:column;
}
.quiz-card-top{padding:14px 18px 4px;}
.q-meta{display:flex; gap:10px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
.q-id{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:14px; color:var(--accent-deep);
  background:var(--paper2); border-radius:30px; padding:2px 11px;
}
.q-section{font-size:11px; color:var(--muted); letter-spacing:.04em;}
.q-stem{
  font-family:"Noto Serif TC",serif; font-size:14.5px; font-weight:500;
  line-height:1.6; margin:2px 0 12px; color:var(--ink);
}
.q-stem .multi{
  font-size:11px; color:var(--accent-deep); font-weight:600;
  background:var(--paper2); padding:1px 7px; border-radius:30px;
  font-family:"Noto Sans TC"; margin-left:6px;
}
.opts{list-style:none; margin:0; padding:0 18px;}
.opt{
  display:flex; gap:10px; align-items:flex-start;
  padding:9px 12px; margin-bottom:6px; cursor:pointer;
  border:1px solid var(--line); border-radius:3px; background:var(--paper);
  transition:.13s; font-size:13.5px; line-height:1.55;
}
.opt:hover{border-color:var(--ink);}
.opt .key{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:15px; width:18px; flex:none; text-align:center; color:var(--muted);
}
.opt.sel{background:#fff; border-color:var(--ink); box-shadow:inset 3px 0 0 var(--ink);}
.opt.sel .key{color:var(--ink);}
.quiz-card.graded .opt{cursor:default;}
.quiz-card.graded .opt.correct{background:rgba(74,107,58,.10); border-color:var(--right); box-shadow:inset 3px 0 0 var(--right);}
.quiz-card.graded .opt.correct .key{color:var(--right);}
.quiz-card.graded .opt.missed{background:rgba(74,107,58,.04); border-style:dashed; border-color:var(--right);}
.quiz-card.graded .opt.wrongpick{background:rgba(168,56,32,.10); border-color:var(--wrong); box-shadow:inset 3px 0 0 var(--wrong);}
.quiz-card.graded .opt.wrongpick .key{color:var(--wrong);}
.opt .mark{margin-left:auto; font-size:11px; font-weight:700; flex:none; align-self:center;}
.opt .mark.g{color:var(--right);} .opt .mark.r{color:var(--wrong);}

.quiz-card-foot{
  padding:6px 18px 14px;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  margin-top:auto;
}
.btn{
  font-family:"Noto Sans TC"; font-weight:700; font-size:12.5px; cursor:pointer;
  border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
  padding:8px 16px; border-radius:3px; transition:.15s;
}
.btn:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
.btn.ghost{background:transparent; color:var(--ink);}
.btn.ghost:hover{background:var(--paper2);}

/* Solution cards */
.solution-card{
  background:var(--card-soft); border:1px solid var(--line-soft);
  border-radius:4px; box-shadow:var(--shadow); overflow:hidden;
  display:flex; flex-direction:column; min-height:180px;
}
.solution-card.locked{
  background:repeating-linear-gradient(45deg, rgba(138,42,28,.025), rgba(138,42,28,.025) 8px, transparent 8px, transparent 16px), var(--card-soft);
  align-items:center; justify-content:center;
  text-align:center; padding:30px 20px;
  color:var(--muted);
}
.solution-card.locked .lock-icon{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:30px; color:var(--accent); opacity:.4; margin-bottom:6px;
}
.solution-card.locked .lock-text{
  font-size:12.5px; font-family:"Noto Serif TC",serif;
  line-height:1.5;
}
.solution-card.locked .lock-hint{
  font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:.04em;
}
.solution-card.revealed{
  padding:14px 18px 16px;
  border-color:var(--accent);
  border-left-width:3px;
  animation:fadeReveal .4s ease;
}
@keyframes fadeReveal{
  from{opacity:0; transform:translateX(-6px);}
  to{opacity:1; transform:translateX(0);}
}
.sol-status{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:16px; margin-bottom:6px;
}
.sol-status.allRight{color:var(--right);}
.sol-status.partial{color:var(--wrong);}
.sol-ans{
  font-family:"Noto Serif TC",serif; font-size:14.5px;
  margin-bottom:10px;
  padding:8px 12px;
  background:rgba(74,107,58,.10);
  border-left:3px solid var(--right);
  border-radius:0 2px 2px 0;
}
.sol-ans .lbl{
  font-size:10.5px; font-weight:700; color:var(--right);
  letter-spacing:.15em; margin-right:8px;
}
.sol-ans .keys{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  color:var(--right); font-size:17px;
}
.sol-explain{
  font-size:13px; line-height:1.7; color:#2d2622;
}
.sol-explain .lbl{
  display:block; font-size:10.5px; font-weight:700; color:var(--muted);
  letter-spacing:.18em; margin-bottom:5px;
}

/* Per-question deep commentary */
.sol-deep{
  margin-top:14px;
  padding:12px 14px 13px;
  background:linear-gradient(135deg, rgba(90,60,95,.10), rgba(168,122,45,.04));
  border:1px solid rgba(90,60,95,.22);
  border-left:3px solid var(--plum);
  border-radius:2px;
  position:relative;
}
.sol-deep::before{
  content:"✦";
  position:absolute; top:10px; right:12px;
  font-size:13px; color:var(--plum); opacity:.55;
}
.sol-deep .lbl{
  display:block;
  font-size:9.5px; letter-spacing:.22em; font-weight:700;
  color:var(--plum); margin-bottom:5px;
}
.sol-deep .body{
  font-family:"Noto Serif TC",serif;
  font-size:12.5px; line-height:1.72;
  color:#3a2f3d; font-weight:500;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1180px){
  .chapter{
    grid-template-columns: 320px minmax(0,1fr) minmax(0,1fr);
    gap:16px;
  }
}
@media (max-width: 980px){
  .chapter{
    grid-template-columns: 1fr;
  }
  .learning-col{
    position:static; max-height:none; padding-right:0;
    border-bottom:2px solid var(--line); padding-bottom:20px;
  }
  .qa-grid{grid-column:1;}
}
@media (max-width: 680px){
  .qa-grid{grid-template-columns:1fr;}
  .qa-grid-header{grid-template-columns:1fr;}
  .qa-grid-header .hdr:nth-child(2){display:none;}
  header.masthead, .topbar, nav.chapter-tabs, main{padding-left:18px; padding-right:18px;}
  .controls{margin-left:0; width:100%;}
}

footer{
  max-width:1440px; margin:0 auto; padding:20px 32px 50px;
  border-top:1px solid var(--line); color:var(--muted); font-size:12px;
  text-align:center;
}

.progress-bar{
  position:fixed; top:0; left:0; height:3px; background:var(--accent);
  width:0; z-index:50; transition:width .2s;
}
</style>
</head>
<body>

<div class="progress-bar" id="pbar"></div>

<header class="masthead">
  <div class="kicker">This is Service Design Thinking · 白咖夜酒脫口秀 · 深度版</div>
  <h1 class="title">服務設計思考<span class="em"> 自測題庫</span></h1>
  <div class="subtitle">
    <span>9 章節 · <b>69</b> 道多選題 · <b>9</b> 段理論深度補充</span>
    <span>左：學習區 / 中：作答區 / 右：解答區</span>
  </div>
</header>

<div class="topbar">
  <div class="stats" id="stats"></div>
  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-mode="quiz" class="on">自測模式</button>
      <button data-mode="study">解答模式</button>
    </div>
    <button class="chip-btn" id="resetAll">清空作答</button>
  </div>
</div>

<nav class="chapter-tabs" id="chapTabs"></nav>

<main id="main"></main>

<footer>
  白咖夜酒脫口秀深度版 · 涵蓋《這就是服務設計思考！》核心 9 章 + 9 大延伸理論<br>
  可離線開啟 · 作答僅保留於目前的瀏覽器畫面，重新整理即清空
</footer>

<script>
(function(){
  const DATA = window.QUIZ_DATA;
  const main = document.getElementById('main');
  const chapTabs = document.getElementById('chapTabs');

  let mode = 'quiz';
  let activeIdx = 0;
  const picks = {};
  const graded = {};

  let total = 0;
  DATA.forEach(c => total += c.questions.length);

  function renderStats(){
    const answered = Object.keys(graded).length;
    const correct = Object.values(graded).filter(Boolean).length;
    const acc = answered ? Math.round(correct/answered*100) : 0;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${answered}<span class="sm"> / ${total}</span></div><div class="l">已作答</div></div>
      <div class="stat ok"><div class="n">${correct}</div><div class="l">答對</div></div>
      <div class="stat ${acc>=80 ? 'ok' : 'warn'}"><div class="n">${answered? acc+'%':'—'}</div><div class="l">正確率</div></div>`;
  }

  function renderTabs(){
    chapTabs.innerHTML = '';
    DATA.forEach((c, i) => {
      const tab = document.createElement('button');
      tab.className = 'ctab' + (i===activeIdx ? ' active' : '');
      const ansInCh = c.questions.filter(q => q.id in graded).length;
      let dotCls = 'progress-dot';
      if(ansInCh === c.questions.length) dotCls += ' full';
      else if(ansInCh > 0) dotCls += ' partial';
      const shortTitle = c.title.split('（')[0];
      tab.innerHTML = `<span class="cnum">${c.cno}</span><span>${shortTitle}</span><span class="${dotCls}"></span>`;
      tab.addEventListener('click', () => {
        activeIdx = i;
        renderTabs();
        renderChapter();
        window.scrollTo({top:0,behavior:'smooth'});
      });
      chapTabs.appendChild(tab);
    });
  }

  function renderChapter(){
    const c = DATA[activeIdx];
    main.innerHTML = '';

    const sec = document.createElement('section');
    sec.className = 'chapter';

    // ===== LEFT: learning col =====
    const learn = document.createElement('aside');
    learn.className = 'learning-col';

    let theoryHtml = '';
    if(c.theory){
      theoryHtml = `
        <div class="theory-block">
          <div class="theory-name"><span class="icon">§</span>理論：${escapeHtml(c.theory.name)}</div>
          <div class="theory-section">
            <span class="sec-label">理論介紹</span>
            <div class="sec-body">${escapeHtml(c.theory.intro)}</div>
          </div>
          <div class="theory-section commentary">
            <span class="sec-label">理論點評</span>
            <div class="sec-body">${escapeHtml(c.theory.commentary)}</div>
          </div>
          ${c.theory.miniInsight ? `
          <div class="mini-insight">
            <span class="mi-label">✦ 觀念延伸</span>
            <div class="mi-body">${escapeHtml(c.theory.miniInsight)}</div>
          </div>` : ''}
        </div>
      `;
    }

    learn.innerHTML = `
      <div class="ch-titleblock">
        <span class="cno">${c.cno}</span>
        <h2>${c.chapter}：${c.title}</h2>
      </div>
      <div class="block-h">📖 重點與知識點</div>
      <ol class="kp-list">
        ${c.knowledgePoints.map(kp => `<li><b>${escapeHtml(kp.h)}</b>${escapeHtml(kp.b)}</li>`).join('')}
      </ol>
      <div class="insight">
        <div class="insight-label">💡 重點精華</div>
        <p class="insight-body">${escapeHtml(c.aiInsight)}</p>
      </div>
      <div class="block-h">🗣️ 情境自問自答</div>
      <div class="scenarios">
        ${c.scenarios.map(s => `
          <details class="scenario">
            <summary>
              <span class="role">${escapeHtml(s.role)}</span>
              <span class="q">${escapeHtml(s.q)}</span>
              <span class="toggle-hint">▾ 點開看 A 與補充說明</span>
            </summary>
            <div class="body-wrap">
              <div class="a">${escapeHtml(s.a)}</div>
              <div class="ai-note">補充說明：${escapeHtml(s.note)}</div>
            </div>
          </details>
        `).join('')}
      </div>
      ${theoryHtml ? `<div class="block-h">📚 理論介紹與深度點評</div>${theoryHtml}` : ''}
    `;
    sec.appendChild(learn);

    // ===== Q/A grid =====
    const qa = document.createElement('div');
    qa.className = 'qa-grid';

    const headers = document.createElement('div');
    headers.className = 'qa-grid-header';
    headers.innerHTML = `<div class="hdr">📝 作答區 — 選擇答案後點「批改」</div><div class="hdr">✓ 解答區 — 批改後顯現</div>`;
    qa.appendChild(headers);

    c.questions.forEach(q => {
      qa.appendChild(buildQuiz(q));
      qa.appendChild(buildSolution(q));
    });
    sec.appendChild(qa);

    main.appendChild(sec);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function letterList(arr){return arr.join('、');}

  function buildQuiz(q){
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.dataset.qid = q.id;
    card.innerHTML = `
      <div class="quiz-card-top">
        <div class="q-meta">
          <span class="q-id">${q.id}</span>
          <span class="q-section">${escapeHtml(q.section)}</span>
        </div>
        <div class="q-stem">${escapeHtml(q.stem)} <span class="multi">複選</span></div>
      </div>
      <ul class="opts">
        ${Object.entries(q.options).map(([k,v]) =>
          `<li class="opt" data-k="${k}"><span class="key">${k}</span><span class="otxt">${escapeHtml(v)}</span></li>`).join('')}
      </ul>
      <div class="quiz-card-foot">
        <button class="btn submit">批改作答</button>
        <button class="btn ghost reset" style="display:none">重做這題</button>
      </div>
    `;
    const opts = [...card.querySelectorAll('.opt')];
    const submitBtn = card.querySelector('.submit');
    const resetBtn = card.querySelector('.reset');

    const sel = picks[q.id] || new Set();
    sel.forEach(k => {
      const el = card.querySelector(`.opt[data-k="${k}"]`);
      if(el) el.classList.add('sel');
    });

    function selectable(){ return mode==='quiz' && !card.classList.contains('graded'); }

    opts.forEach(el => el.addEventListener('click', () => {
      if(!selectable()) return;
      const k = el.dataset.k;
      const s = picks[q.id] || (picks[q.id] = new Set());
      if(s.has(k)){ s.delete(k); el.classList.remove('sel'); }
      else{ s.add(k); el.classList.add('sel'); }
    }));

    function markUp(){
      const chosen = picks[q.id] || new Set();
      const correct = new Set(q.correct);
      let allRight = true;
      opts.forEach(el => {
        const k = el.dataset.k;
        const isC = correct.has(k), isP = chosen.has(k);
        const oldMark = el.querySelector('.mark');
        if(oldMark) oldMark.remove();
        el.classList.remove('correct','missed','wrongpick');
        if(isC && isP){
          el.classList.add('correct');
          el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">✓ 該選</span>');
        } else if(isC && !isP){
          el.classList.add('missed');
          el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">＋ 漏選</span>');
          allRight = false;
        } else if(!isC && isP){
          el.classList.add('wrongpick');
          el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark r">✗ 不該選</span>');
          allRight = false;
        }
      });
      return allRight;
    }

    function grade(){
      const chosen = picks[q.id] || new Set();
      if(chosen.size === 0){
        submitBtn.textContent = '請先選擇答案';
        submitBtn.style.borderColor = 'var(--wrong)';
        submitBtn.style.color = 'var(--wrong)';
        submitBtn.style.background = 'transparent';
        setTimeout(() => {
          submitBtn.textContent = '批改作答';
          submitBtn.style.cssText = '';
        }, 1400);
        return;
      }
      card.classList.add('graded');
      const allRight = markUp();
      graded[q.id] = allRight;
      submitBtn.style.display = 'none';
      resetBtn.style.display = '';
      revealSolution(q, allRight);
      renderStats();
      renderTabs();
    }

    submitBtn.addEventListener('click', grade);
    resetBtn.addEventListener('click', () => {
      card.classList.remove('graded');
      picks[q.id] = new Set();
      delete graded[q.id];
      opts.forEach(el => {
        el.classList.remove('sel','correct','missed','wrongpick');
        const m = el.querySelector('.mark'); if(m) m.remove();
      });
      submitBtn.style.display = '';
      resetBtn.style.display = 'none';
      hideSolution(q);
      renderStats();
      renderTabs();
    });

    if(mode === 'study'){
      card.classList.add('graded');
      const correct = new Set(q.correct);
      opts.forEach(el => {
        el.classList.remove('sel','wrongpick','missed','correct');
        const m = el.querySelector('.mark'); if(m) m.remove();
        if(correct.has(el.dataset.k)){
          el.classList.add('correct');
          el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">✓ 正解</span>');
        }
      });
      submitBtn.style.display = 'none';
      resetBtn.style.display = 'none';
    } else if(q.id in graded){
      card.classList.add('graded');
      markUp();
      submitBtn.style.display = 'none';
      resetBtn.style.display = '';
    }

    return card;
  }

  function buildSolution(q){
    const card = document.createElement('div');
    card.className = 'solution-card';
    card.dataset.solid = q.id;
    if(mode === 'study'){
      revealSolutionCard(card, q, null);
    } else if(q.id in graded){
      revealSolutionCard(card, q, graded[q.id]);
    } else {
      lockSolutionCard(card, q);
    }
    return card;
  }

  function lockSolutionCard(card, q){
    card.className = 'solution-card locked';
    card.innerHTML = `
      <div class="lock-icon">?</div>
      <div class="lock-text">完成作答後<br>此處將顯示解答與詳解</div>
      <div class="lock-hint">第 ${q.id} 題</div>
    `;
  }
  function revealSolutionCard(card, q, allRight){
    card.className = 'solution-card revealed';
    let statusHtml = '';
    if(allRight === true){
      statusHtml = '<div class="sol-status allRight">✓ 全對！</div>';
    } else if(allRight === false){
      statusHtml = '<div class="sol-status partial">✗ 看下方詳解</div>';
    } else {
      statusHtml = '<div class="sol-status" style="color:var(--accent-deep);">📖 解答模式</div>';
    }
    card.innerHTML = `
      ${statusHtml}
      <div class="sol-ans">
        <span class="lbl">正解</span>
        <span class="keys">${letterList(q.correct)}</span>
      </div>
      <div class="sol-explain">
        <span class="lbl">詳解</span>
        ${escapeHtml(q.explain)}
      </div>
      ${q.deepNote ? `
      <div class="sol-deep">
        <span class="lbl">✦ 延伸點評</span>
        <div class="body">${escapeHtml(q.deepNote)}</div>
      </div>` : ''}
    `;
  }
  function revealSolution(q, allRight){
    const card = main.querySelector(`.solution-card[data-solid="${q.id}"]`);
    if(card) revealSolutionCard(card, q, allRight);
  }
  function hideSolution(q){
    const card = main.querySelector(`.solution-card[data-solid="${q.id}"]`);
    if(card) lockSolutionCard(card, q);
  }

  document.querySelectorAll('#modeSeg button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#modeSeg button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      mode = b.dataset.mode;
      renderChapter();
    });
  });

  document.getElementById('resetAll').addEventListener('click', function(){
    if(!confirm('確定要清空所有作答嗎？')) return;
    for(const k in picks) delete picks[k];
    for(const k in graded) delete graded[k];
    this.classList.add('flash');
    setTimeout(() => this.classList.remove('flash'), 600);
    renderStats();
    renderTabs();
    renderChapter();
  });

  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const p = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
    document.getElementById('pbar').style.width = p + '%';
  });

  renderTabs();
  renderChapter();
  renderStats();
})();
</script>
</body>
</html>
