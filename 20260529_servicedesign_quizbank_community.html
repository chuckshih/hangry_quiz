}
.stat .n{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:22px; line-height:1.1; color:var(--ink);
}
.stat .n .sm{font-size:13px; color:var(--muted); font-style:normal; font-weight:500;}
.stat.warn .n{color:var(--accent);}
.stat.ok .n{color:var(--right);}
.stat .l{font-size:10.5px; color:var(--muted); letter-spacing:.08em; margin-top:1px;}

.controls{margin-left:auto; display:flex; gap:10px; align-items:center;}
.seg{display:flex; border:1.5px solid var(--ink); border-radius:3px; overflow:hidden;}
.seg button{
  font-family:"Noto Sans TC"; font-size:12.5px; font-weight:700;
  background:transparent; border:none; padding:8px 14px; cursor:pointer;
  color:var(--ink); border-right:1px solid var(--ink); transition:.15s;
}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--ink); color:var(--paper);}
.chip-btn{
  font-family:"Noto Sans TC"; font-size:12.5px; font-weight:700; cursor:pointer;
  background:var(--card); border:1px solid var(--line); border-radius:30px;
  padding:7px 14px; color:var(--ink); transition:.15s; white-space:nowrap;
}
.chip-btn:hover{border-color:var(--ink);}
.chip-btn.flash{background:var(--gold-soft); border-color:var(--gold);}

/* ============ CHAPTER TABS ============ */
nav.chapter-tabs{
  max-width:1440px; margin:14px auto 0; padding:0 32px;
  display:flex; gap:6px; flex-wrap:wrap;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
}
.ctab{
  font-family:"Noto Sans TC"; font-size:13px; font-weight:700;
  background:var(--card); border:1px solid var(--line); border-radius:3px;
  padding:8px 14px; color:var(--ink); cursor:pointer; transition:.15s;
  display:flex; align-items:center; gap:8px;
}
.ctab:hover{border-color:var(--ink);}
.ctab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.ctab .cnum{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900; font-size:15px;
}
.ctab.active .cnum{color:#f4d896;}
.ctab .progress-dot{
  width:7px; height:7px; border-radius:50%; background:transparent;
  border:1.5px solid var(--muted); transition:.2s;
}
.ctab .progress-dot.partial{background:var(--gold); border-color:var(--gold);}
.ctab .progress-dot.full{background:var(--right); border-color:var(--right);}
.ctab.active .progress-dot{border-color:#f4d896;}

/* ============ MAIN: 3-column per chapter ============ */
main{max-width:1440px; margin:0 auto; padding:24px 32px 80px;}

.chapter{
  display:grid;
  grid-template-columns: 340px minmax(0,1fr) minmax(0,1fr);
  gap:22px;
  align-items:start;
}

/* === LEARNING COLUMN (left, sticky) === */
.learning-col{
  position:sticky;
  top:16px;
  align-self:start;
  max-height:calc(100vh - 32px);
  overflow-y:auto;
  padding-right:8px;
  /* custom scrollbar */
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
}
.learning-col::-webkit-scrollbar{width:6px;}
.learning-col::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

.ch-titleblock{
  border-bottom:2px solid var(--ink);
  padding-bottom:10px;
  margin-bottom:18px;
}
.ch-titleblock .cno{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:34px; color:var(--accent); line-height:1;
  display:block;
}
.ch-titleblock h2{
  font-family:"Noto Serif TC",serif; font-weight:700;
  font-size:21px; margin:6px 0 0; letter-spacing:-.3px;
}

.block-h{
  font-family:"Noto Sans TC"; font-size:11px; font-weight:700;
  letter-spacing:.18em; color:var(--accent-deep);
  margin:22px 0 10px; padding-bottom:5px;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:6px;
}

.kp-list{padding-left:22px; margin:0;}
.kp-list li{
  margin-bottom:11px; font-size:13.5px; line-height:1.7;
  padding-left:4px;
}
.kp-list li b{
  color:var(--accent-deep); font-weight:700;
  display:block; margin-bottom:2px;
  font-family:"Noto Serif TC",serif;
  font-size:14px;
}

.insight{
  margin:18px 0;
  padding:16px 18px 16px 38px;
  background:linear-gradient(135deg, rgba(192,138,45,.10), rgba(31,91,110,.04));
  border-left:3px solid var(--gold);
  border-radius:2px;
  position:relative;
  font-family:"Noto Serif TC",serif;
}
.insight::before{
  content:"“";
  position:absolute; left:10px; top:-4px;
  font-family:"Fraunces",serif;
  font-size:60px; color:var(--gold); opacity:.55; line-height:1;
}
.insight-label{
  font-size:10px; letter-spacing:.2em; font-weight:700;
  color:var(--gold); margin-bottom:5px;
}
.insight-body{
  font-size:14.5px; line-height:1.65; margin:0; font-weight:500;
}

.scenario{
  background:var(--card); border:1px solid var(--line); border-radius:3px;
  margin-bottom:10px; box-shadow:var(--shadow);
  transition:.15s;
}
.scenario[open]{border-color:var(--accent);}
.scenario summary{
  list-style:none; cursor:pointer; padding:12px 14px;
  display:flex; flex-direction:column; gap:6px;
  position:relative;
}
.scenario summary::-webkit-details-marker{display:none;}
.scenario .role{
  font-size:11px; color:var(--accent-deep); letter-spacing:.03em;
  font-weight:700;
  background:var(--card-soft); padding:3px 8px; border-radius:2px;
  display:inline-block; align-self:flex-start;
}
.scenario .q{
  font-family:"Noto Serif TC",serif; font-size:13.5px;
  line-height:1.55; color:var(--ink); font-weight:500;
}
.scenario .q::before{content:"Q　"; color:var(--accent); font-weight:900; font-family:"Fraunces",serif; font-style:italic;}
.scenario .toggle-hint{
  font-size:10.5px; color:var(--muted);
  margin-top:2px;
}
.scenario[open] .toggle-hint{display:none;}
.scenario .body-wrap{
  padding:2px 14px 14px;
  border-top:1px dashed var(--line);
}
.scenario .a{
  font-size:13px; line-height:1.7; color:#2d3b3f;
  margin-top:10px;
}
.scenario .a::before{content:"A　"; color:var(--right); font-weight:900; font-family:"Fraunces",serif; font-style:italic;}
.scenario .ai-note{
  margin-top:10px; font-size:11.5px; color:var(--accent-deep);
  background:rgba(31,91,110,.07); padding:7px 11px;
  border-left:3px solid var(--accent); border-radius:0 2px 2px 0;
  font-style:italic; line-height:1.5;
}

/* === Q/A GRID (middle + right columns) === */
.qa-grid{
  grid-column: 2 / span 2;
  display:grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  gap:14px;
}
.qa-grid-header{
  grid-column: 1 / -1;
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:14px;
  margin-bottom:-4px;
}
.qa-grid-header .hdr{
  font-family:"Noto Sans TC"; font-size:11px; font-weight:700;
  letter-spacing:.18em; color:var(--muted);
  padding:0 6px 6px; border-bottom:1px solid var(--line);
}

/* Quiz cards */
.quiz-card{
  background:var(--card); border:1px solid var(--line);
  border-radius:4px; box-shadow:var(--shadow); overflow:hidden;
  display:flex; flex-direction:column;
}
.quiz-card-top{padding:14px 18px 4px;}
.q-meta{display:flex; gap:10px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
.q-id{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:14px; color:var(--accent-deep);
  background:var(--paper2); border-radius:30px; padding:2px 11px;
}
.q-section{font-size:11px; color:var(--muted); letter-spacing:.04em;}
.q-stem{
  font-family:"Noto Serif TC",serif; font-size:14.5px; font-weight:500;
  line-height:1.6; margin:2px 0 12px; color:var(--ink);
}
.q-stem .multi{
  font-size:11px; color:var(--accent-deep); font-weight:600;
  background:var(--paper2); padding:1px 7px; border-radius:30px;
  font-family:"Noto Sans TC"; margin-left:6px;
}
.opts{list-style:none; margin:0; padding:0 18px;}
.opt{
  display:flex; gap:10px; align-items:flex-start;
  padding:9px 12px; margin-bottom:6px; cursor:pointer;
  border:1px solid var(--line); border-radius:3px; background:var(--paper);
  transition:.13s; font-size:13.5px; line-height:1.55;
}
.opt:hover{border-color:var(--ink);}
.opt .key{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:15px; width:18px; flex:none; text-align:center; color:var(--muted);
}
.opt.sel{background:#fff; border-color:var(--ink); box-shadow:inset 3px 0 0 var(--ink);}
.opt.sel .key{color:var(--ink);}
.quiz-card.graded .opt{cursor:default;}
.quiz-card.graded .opt.correct{background:rgba(61,107,74,.10); border-color:var(--right); box-shadow:inset 3px 0 0 var(--right);}
.quiz-card.graded .opt.correct .key{color:var(--right);}
.quiz-card.graded .opt.missed{background:rgba(61,107,74,.04); border-style:dashed; border-color:var(--right);}
.quiz-card.graded .opt.wrongpick{background:rgba(181,64,42,.10); border-color:var(--wrong); box-shadow:inset 3px 0 0 var(--wrong);}
.quiz-card.graded .opt.wrongpick .key{color:var(--wrong);}
.opt .mark{margin-left:auto; font-size:11px; font-weight:700; flex:none; align-self:center;}
.opt .mark.g{color:var(--right);} .opt .mark.r{color:var(--wrong);}

.quiz-card-foot{
  padding:6px 18px 14px;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  margin-top:auto;
}
.btn{
  font-family:"Noto Sans TC"; font-weight:700; font-size:12.5px; cursor:pointer;
  border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
  padding:8px 16px; border-radius:3px; transition:.15s;
}
.btn:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
.btn.ghost{background:transparent; color:var(--ink);}
.btn.ghost:hover{background:var(--paper2);}

/* Solution cards */
.solution-card{
  background:var(--card-soft); border:1px solid var(--line-soft);
  border-radius:4px; box-shadow:var(--shadow); overflow:hidden;
  display:flex; flex-direction:column; min-height:180px;
}
.solution-card.locked{
  background:repeating-linear-gradient(45deg, rgba(31,91,110,.025), rgba(31,91,110,.025) 8px, transparent 8px, transparent 16px), var(--card-soft);
  align-items:center; justify-content:center;
  text-align:center; padding:30px 20px;
  color:var(--muted);
}
.solution-card.locked .lock-icon{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:30px; color:var(--accent); opacity:.4; margin-bottom:6px;
}
.solution-card.locked .lock-text{
  font-size:12.5px; font-family:"Noto Serif TC",serif;
  line-height:1.5;
}
.solution-card.locked .lock-hint{
  font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:.04em;
}
.solution-card.revealed{
  padding:14px 18px 16px;
  border-color:var(--accent);
  border-left-width:3px;
  animation:fadeReveal .4s ease;
}
@keyframes fadeReveal{
  from{opacity:0; transform:translateX(-6px);}
  to{opacity:1; transform:translateX(0);}
}
.sol-status{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  font-size:16px; margin-bottom:6px;
}
.sol-status.allRight{color:var(--right);}
.sol-status.partial{color:var(--wrong);}
.sol-ans{
  font-family:"Noto Serif TC",serif; font-size:14.5px;
  margin-bottom:10px;
  padding:8px 12px;
  background:rgba(61,107,74,.10);
  border-left:3px solid var(--right);
  border-radius:0 2px 2px 0;
}
.sol-ans .lbl{
  font-size:10.5px; font-weight:700; color:var(--right);
  letter-spacing:.15em; margin-right:8px;
}
.sol-ans .keys{
  font-family:"Fraunces",serif; font-style:italic; font-weight:900;
  color:var(--right); font-size:17px;
}
.sol-explain{
  font-size:13px; line-height:1.7; color:#2d3b3f;
}
.sol-explain .lbl{
  display:block; font-size:10.5px; font-weight:700; color:var(--muted);
  letter-spacing:.18em; margin-bottom:5px;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1180px){
  .chapter{
    grid-template-columns: 280px minmax(0,1fr) minmax(0,1fr);
    gap:16px;
  }
}
@media (max-width: 980px){
  .chapter{
    grid-template-columns: 1fr;
  }
  .learning-col{
    position:static; max-height:none; padding-right:0;
    border-bottom:2px solid var(--line); padding-bottom:20px;
  }
  .qa-grid{grid-column:1;}
}
@media (max-width: 680px){
  .qa-grid{grid-template-columns:1fr;}
  .qa-grid-header{grid-template-columns:1fr;}
  .qa-grid-header .hdr:nth-child(2){display:none;}
  header.masthead, .topbar, nav.chapter-tabs, main{padding-left:18px; padding-right:18px;}
  .controls{margin-left:0; width:100%;}
}

footer{
  max-width:1440px; margin:0 auto; padding:20px 32px 50px;
  border-top:1px solid var(--line); color:var(--muted); font-size:12px;
  text-align:center;
}

.progress-bar{
  position:fixed; top:0; left:0; height:3px; background:var(--accent);
  width:0; z-index:50; transition:width .2s;
}
</style>
</head>
<body>

<div class="progress-bar" id="pbar"></div>

<header class="masthead">
  <div class="kicker">This is Service Design Thinking · 社區管理 LINE Bot 版</div>
  <h1 class="title">服務設計思考<span class="em"> 自測題庫</span></h1>
  <div class="subtitle">
    <span>9 章節 · <b>45</b> 道多選題 · <b>27</b> 段社區情境</span>
    <span>左：學習區 / 中：作答區 / 右：解答區</span>
  </div>
</header>

<div class="topbar">
  <div class="stats" id="stats"></div>
  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-mode="quiz" class="on">自測模式</button>
      <button data-mode="study">解答模式</button>
    </div>
    <button class="chip-btn" id="resetAll">清空作答</button>
  </div>
</div>

<nav class="chapter-tabs" id="chapTabs"></nav>

<main id="main"></main>

<footer>
  社區管理 LINE Bot 版題庫 · 涵蓋《這就是服務設計思考！》核心 9 章節<br>
  可離線開啟 · 作答僅保留於目前的瀏覽器畫面，重新整理即清空
</footer>

<script>
(function(){
  const DATA = window.QUIZ_DATA;
  const main = document.getElementById('main');
  const chapTabs = document.getElementById('chapTabs');

  let mode = 'quiz';      // 'quiz' | 'study'
  let activeIdx = 0;       // 當前章節 index
  const picks = {};        // qid -> Set(<key>) 作答選擇
  const graded = {};       // qid -> boolean 是否答對

  // ---- count totals
  let total = 0;
  DATA.forEach(c => total += c.questions.length);

  // ---- stats panel ----
  function renderStats(){
    const answered = Object.keys(graded).length;
    const correct = Object.values(graded).filter(Boolean).length;
    const acc = answered ? Math.round(correct/answered*100) : 0;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${answered}<span class="sm"> / ${total}</span></div><div class="l">已作答</div></div>
      <div class="stat ok"><div class="n">${correct}</div><div class="l">答對</div></div>
      <div class="stat ${acc>=80 ? 'ok' : 'warn'}"><div class="n">${answered? acc+'%':'—'}</div><div class="l">正確率</div></div>`;
  }

  // ---- chapter tabs ----
  function renderTabs(){
    chapTabs.innerHTML = '';
    DATA.forEach((c, i) => {
      const tab = document.createElement('button');
      tab.className = 'ctab' + (i===activeIdx ? ' active' : '');
      // progress dot
      const ansInCh = c.questions.filter(q => q.id in graded).length;
      let dotCls = 'progress-dot';
      if(ansInCh === c.questions.length) dotCls += ' full';
      else if(ansInCh > 0) dotCls += ' partial';
      tab.innerHTML = `<span class="cnum">${c.cno}</span><span>${c.title.split('（')[0]}</span><span class="${dotCls}"></span>`;
      tab.addEventListener('click', () => {
        activeIdx = i;
        renderTabs();
        renderChapter();
        window.scrollTo({top:0,behavior:'smooth'});
      });
      chapTabs.appendChild(tab);
    });
  }

  // ---- chapter render ----
  function renderChapter(){
    const c = DATA[activeIdx];
    main.innerHTML = '';

    const sec = document.createElement('section');
    sec.className = 'chapter';

    // ===== LEFT: learning col =====
    const learn = document.createElement('aside');
    learn.className = 'learning-col';
    learn.innerHTML = `
      <div class="ch-titleblock">
        <span class="cno">${c.cno}</span>
        <h2>${c.chapter}：${c.title}</h2>
      </div>
      <div class="block-h">📖 重點與知識點</div>
      <ol class="kp-list">
        ${c.knowledgePoints.map(kp => `<li><b>${kp.h}</b>${kp.b}</li>`).join('')}
      </ol>
      <div class="insight">
        <div class="insight-label">💡 AI 補充精華</div>
        <p class="insight-body">${c.aiInsight}</p>
      </div>
      <div class="block-h">🗣️ 情境自問自答</div>
      <div class="scenarios">
        ${c.scenarios.map(s => `
          <details class="scenario">
            <summary>
              <span class="role">${escapeHtml(s.role)}</span>
              <span class="q">${escapeHtml(s.q)}</span>
              <span class="toggle-hint">▾ 點開看 A 與 AI 註解</span>
            </summary>
            <div class="body-wrap">
              <div class="a">${escapeHtml(s.a)}</div>
              <div class="ai-note">AI 註解：${escapeHtml(s.note)}</div>
            </div>
          </details>
        `).join('')}
      </div>
    `;
    sec.appendChild(learn);

    // ===== RIGHT (middle + right cols): Q/A grid =====
    const qa = document.createElement('div');
    qa.className = 'qa-grid';

    // column headers
    const headers = document.createElement('div');
    headers.className = 'qa-grid-header';
    headers.innerHTML = `<div class="hdr">📝 作答區 — 選擇答案後點「批改」</div><div class="hdr">✓ 解答區 — 批改後顯現</div>`;
    qa.appendChild(headers);

    // question rows
    c.questions.forEach(q => {
      const row = document.createDocumentFragment();
      row.appendChild(buildQuiz(q));
      row.appendChild(buildSolution(q));
      qa.appendChild(row);
    });
    sec.appendChild(qa);

    main.appendChild(sec);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function letterList(arr){return arr.join('、');}

  // ---- build quiz card ----
  function buildQuiz(q){
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.dataset.qid = q.id;
    const multiHint = q.correct.length > 1 ? '複選' : '單選或複選';
    card.innerHTML = `
      <div class="quiz-card-top">
        <div class="q-meta">
          <span class="q-id">${q.id}</span>
          <span class="q-section">${escapeHtml(q.section)}</span>
        </div>
        <div class="q-stem">${escapeHtml(q.stem)} <span class="multi">${multiHint}</span></div>
      </div>
      <ul class="opts">
        ${Object.entries(q.options).map(([k,v]) =>
          `<li class="opt" data-k="${k}"><span class="key">${k}</span><span class="otxt">${escapeHtml(v)}</span></li>`).join('')}
      </ul>
      <div class="quiz-card-foot">
        <button class="btn submit">批改作答</button>
        <button class="btn ghost reset" style="display:none">重做這題</button>
      </div>
    `;
    const opts = [...card.querySelectorAll('.opt')];
    const submitBtn = card.querySelector('.submit');
    const resetBtn = card.querySelector('.reset');

    // restore selection
    const sel = picks[q.id] || new Set();
    sel.forEach(k => {
      const el = card.querySelector(`.opt[data-k="${k}"]`);
      if(el) el.classList.add('sel');
    });

    function selectable(){ return mode==='quiz' && !card.classList.contains('graded'); }

    opts.forEach(el => el.addEventListener('click', () => {
      if(!selectable()) return;
      const k = el.dataset.k;
      const s = picks[q.id] || (picks[q.id] = new Set());
      if(s.has(k)){ s.delete(k); el.classList.remove('sel'); }
      else{ s.add(k); el.classList.add('sel'); }
    }));

    function markUp(){
      const chosen = picks[q.id] || new Set();
      const correct = new Set(q.correct);
      let allRight = true;
      opts.forEach(el => {
        const k = el.dataset.k;
        const isC = correct.has(k), isP = chosen.has(k);
        // remove existing marks
        const oldMark = el.querySelector('.mark');
        if(oldMark) oldMark.remove();
        el.classList.remove('correct','missed','wrongpick');
        if(isC && isP){
          el.classList.add('correct');
          el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">✓ 該選</span>');
        } else if(isC && !isP){
          el.classList.add('missed');
          el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">＋ 漏選</span>');
          allRight = false;
        } else if(!isC && isP){
          el.classList.add('wrongpick');
          el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark r">✗ 不該選</span>');
          allRight = false;
        }
      });
      return allRight;
    }

    function grade(){
      const chosen = picks[q.id] || new Set();
      if(chosen.size === 0){
        // tiny feedback
        submitBtn.textContent = '請先選擇答案';
        submitBtn.style.borderColor = 'var(--wrong)';
        submitBtn.style.color = 'var(--wrong)';
        submitBtn.style.background = 'transparent';
        setTimeout(() => {
          submitBtn.textContent = '批改作答';
          submitBtn.style.cssText = '';
        }, 1400);
        return;
      }
      card.classList.add('graded');
      const allRight = markUp();
      graded[q.id] = allRight;
      submitBtn.style.display = 'none';
      resetBtn.style.display = '';
      revealSolution(q, allRight);
      renderStats();
      renderTabs(); // update progress dot
    }

    submitBtn.addEventListener('click', grade);
    resetBtn.addEventListener('click', () => {
      card.classList.remove('graded');
      picks[q.id] = new Set();
      delete graded[q.id];
      opts.forEach(el => {
        el.classList.remove('sel','correct','missed','wrongpick');
        const m = el.querySelector('.mark'); if(m) m.remove();
      });
      submitBtn.style.display = '';
      resetBtn.style.display = 'none';
      hideSolution(q);
      renderStats();
      renderTabs();
    });

    // Apply mode: study mode auto-reveals
    if(mode === 'study'){
      card.classList.add('graded');
      const correct = new Set(q.correct);
      opts.forEach(el => {
        el.classList.remove('sel','wrongpick','missed','correct');
        const m = el.querySelector('.mark'); if(m) m.remove();
        if(correct.has(el.dataset.k)){
          el.classList.add('correct');
          el.querySelector('.otxt').insertAdjacentHTML('afterend','<span class="mark g">✓ 正解</span>');
        }
      });
      submitBtn.style.display = 'none';
      resetBtn.style.display = 'none';
    } else if(q.id in graded){
      // quiz mode but previously graded → restore graded state
      card.classList.add('graded');
      markUp();
      submitBtn.style.display = 'none';
      resetBtn.style.display = '';
    }

    return card;
  }

  // ---- build solution card (initially locked) ----
  function buildSolution(q){
    const card = document.createElement('div');
    card.className = 'solution-card';
    card.dataset.solid = q.id;
    if(mode === 'study'){
      revealSolutionCard(card, q, null);
    } else if(q.id in graded){
      revealSolutionCard(card, q, graded[q.id]);
    } else {
      lockSolutionCard(card, q);
    }
    return card;
  }

  function lockSolutionCard(card, q){
    card.className = 'solution-card locked';
    card.innerHTML = `
      <div class="lock-icon">?</div>
      <div class="lock-text">完成作答後<br>此處將顯示解答與詳解</div>
      <div class="lock-hint">第 ${q.id} 題</div>
    `;
  }
  function revealSolutionCard(card, q, allRight){
    card.className = 'solution-card revealed';
    let statusHtml = '';
    if(allRight === true){
      statusHtml = '<div class="sol-status allRight">✓ 全對！</div>';
    } else if(allRight === false){
      statusHtml = '<div class="sol-status partial">✗ 看下方詳解</div>';
    } else {
      statusHtml = '<div class="sol-status" style="color:var(--accent-deep);">📖 解答模式</div>';
    }
    card.innerHTML = `
      ${statusHtml}
      <div class="sol-ans">
        <span class="lbl">正解</span>
        <span class="keys">${letterList(q.correct)}</span>
      </div>
      <div class="sol-explain">
        <span class="lbl">詳解</span>
        ${escapeHtml(q.explain)}
      </div>
    `;
  }
  function revealSolution(q, allRight){
    const card = main.querySelector(`.solution-card[data-solid="${q.id}"]`);
    if(card) revealSolutionCard(card, q, allRight);
  }
  function hideSolution(q){
    const card = main.querySelector(`.solution-card[data-solid="${q.id}"]`);
    if(card) lockSolutionCard(card, q);
  }

  // ---- mode switch ----
  document.querySelectorAll('#modeSeg button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#modeSeg button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      mode = b.dataset.mode;
      renderChapter();
    });
  });

  // ---- reset all ----
  document.getElementById('resetAll').addEventListener('click', function(){
    if(!confirm('確定要清空所有作答嗎？')) return;
    for(const k in picks) delete picks[k];
    for(const k in graded) delete graded[k];
    this.classList.add('flash');
    setTimeout(() => this.classList.remove('flash'), 600);
    renderStats();
    renderTabs();
    renderChapter();
  });

  // ---- scroll progress ----
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const p = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
    document.getElementById('pbar').style.width = p + '%';
  });

  // ---- init ----
  renderTabs();
  renderChapter();
  renderStats();
})();
</script>
</body>
</html>
